<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Catalogue Manager</title>
<style>
/* ================================================================
   Bulk Catalogue Manager for WooCommerce — clickable prototype
   WordPress 7 admin, exactly: system stack, 13px, #2271b1 accent.
   Single light theme on purpose. wp-admin is a light surface.
   ================================================================ */
:root{
  color-scheme:light;

  --menu:#1d2327;
  --menu-2:#2c3338;
  --menu-3:#3c434a;
  --menu-text:#f0f0f1;
  --menu-dim:#c3c4c7;

  --ground:#f0f0f1;
  --panel:#ffffff;
  --sunk:#f6f7f7;
  --sunk-2:#fbfbfc;

  --rule:#dcdcde;
  --rule-strong:#c3c4c7;
  --rule-soft:#f0f0f1;

  --ink:#1d2327;
  --ink-2:#50575e;
  --ink-3:#646970;          /* AA on white, the meta-text floor */

  --blue:#2271b1;
  --blue-dark:#135e96;
  --blue-darker:#0a4b78;
  --blue-tint:#f0f6fc;
  --blue-line:#a7c8e8;

  --good:#00a32a;
  --good-ink:#125c2a;
  --good-tint:#edfaef;
  --good-line:#b8e6c3;
  --warn:#dba617;
  --warn-ink:#6b5209;
  --warn-tint:#fcf9e8;
  --warn-line:#f0e0a8;
  --bad:#d63638;
  --bad-ink:#8a2424;
  --bad-tint:#fcf0f1;
  --bad-line:#f3c3c4;

  --r:3px;
  --bar:32px;
  --menu-w:160px;
  --tree-w:236px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#adminbar :focus-visible,#adminmenu :focus-visible{outline:2px solid #fff;outline-offset:-2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ---------------- admin bar ---------------- */
#adminbar{
  position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:120;
  background:var(--menu);color:var(--menu-dim);display:flex;align-items:center;padding-right:8px;
}
#adminbar .ab{display:flex;align-items:center;gap:6px;height:var(--bar);padding:0 10px;background:none;border:0;color:var(--menu-dim);cursor:default;white-space:nowrap}
#adminbar .ab:hover{color:#72aee6}
#adminbar .right{margin-left:auto;display:flex}
.ab-avatar{width:16px;height:16px;border-radius:50%;background:#50575e;display:inline-block}
.ab-logo{width:15px;height:15px;border:2px solid currentColor;border-radius:50%;display:inline-block}

/* ---------------- admin menu ---------------- */
#adminmenu{
  position:fixed;top:var(--bar);left:0;bottom:0;width:var(--menu-w);z-index:110;
  background:var(--menu);color:var(--menu-dim);overflow:auto;scrollbar-width:thin;
}
#adminmenu .mi{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:none;border:0;text-align:left;color:var(--menu-text);cursor:default;white-space:nowrap}
#adminmenu .mi .ico{width:18px;flex:none;text-align:center;opacity:.72}
#adminmenu .mi:hover{background:var(--menu-2);color:#72aee6}
#adminmenu .mi.current{background:var(--blue);color:#fff;font-weight:600}
#adminmenu .mi.open{background:var(--menu-2);color:#fff}
#adminmenu .sub{background:var(--menu-2);padding:4px 0}
#adminmenu .sub button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 10px 5px 36px;color:var(--menu-dim);cursor:default}
#adminmenu .sub button:hover{color:#72aee6}
#adminmenu .sub button.current{color:#fff;font-weight:600}
#adminmenu .sep{height:1px;background:var(--menu-3);margin:6px 0}

/* ---------------- page shell ---------------- */
#wpbody{
  position:fixed;top:var(--bar);left:var(--menu-w);right:0;bottom:0;
  display:flex;flex-direction:column;gap:10px;padding:14px 20px 50px;min-width:0;
}
.crumb{color:var(--ink-3);font-size:12px}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead h1{font-size:23px;font-weight:400;line-height:1.3}
.pagehead .lede{color:var(--ink-2);margin-top:2px;max-width:66ch}
.pagehead .acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.screennav{display:flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.screennav button{border:0;background:var(--panel);padding:0 12px;height:30px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:600}
.screennav button+button{border-left:1px solid var(--rule)}
.screennav button:hover{background:var(--sunk);color:var(--ink)}
.screennav button[aria-current="true"]{background:var(--blue-tint);color:var(--blue-darker);box-shadow:inset 0 -2px 0 var(--blue)}

/* ---------------- controls ---------------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid var(--blue);border-radius:var(--r);background:var(--sunk);color:var(--blue-dark);
  cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--blue-tint);border-color:var(--blue-dark);color:var(--blue-darker)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.btn-quiet{border-color:var(--rule-strong);background:var(--panel);color:var(--ink-2)}
.btn-quiet:hover{border-color:#8c8f94;background:var(--sunk);color:var(--ink)}
.btn-danger{border-color:var(--bad);color:var(--bad);background:var(--panel)}
.btn-danger:hover{background:var(--bad-tint);color:var(--bad-ink);border-color:var(--bad)}
.btn-sm{height:26px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-link{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.btn-link:hover{color:var(--blue-darker)}
.field{height:30px;padding:0 8px;border:1px solid #8c8f94;border-radius:var(--r);background:var(--panel);max-width:100%;min-width:0}
select.field{padding-right:22px}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue);outline:none}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.hint{color:var(--ink-3);font-size:12px;line-height:1.45}
input[type=checkbox],input[type=radio]{accent-color:var(--blue);width:15px;height:15px;margin:0}

/* ---------------- the workspace ---------------- */
.slab{
  flex:1;min-height:0;display:grid;grid-template-columns:var(--tree-w) minmax(0,1fr);
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;overflow:hidden;position:relative;
}
.slab.solo{grid-template-columns:minmax(0,1fr)}

/* ---------------- category tree ---------------- */
.tree-pane{border-right:1px solid var(--rule);background:var(--sunk);display:flex;flex-direction:column;min-height:0;min-width:0}
.tree-head{padding:10px 11px 9px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.tree-head h2{font-size:13px;font-weight:600}
.tree-head .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tree-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:6px 5px 48px}
.tree-foot{border-top:1px solid var(--rule);padding:8px 10px}
.tnode{position:relative}
.trow{display:flex;align-items:center;gap:1px;border-radius:var(--r);position:relative}
.trow:hover{background:#eceef0}
.trow.sel{background:var(--blue-tint);box-shadow:inset 2px 0 0 var(--blue)}
.trow.drag{opacity:.45}
.trow.dz-before::before,.trow.dz-after::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--blue)}
.trow.dz-before::before{top:-1px}
.trow.dz-after::after{bottom:-1px}
.trow.dz-in{box-shadow:inset 0 0 0 2px var(--blue);background:var(--blue-tint)}
/* the drag handle is the only affordance for re-parenting, so it has to clear
   the 3:1 non-text contrast bar at rest, not just on hover */
.grip{width:14px;height:24px;flex:none;display:grid;place-items:center;color:var(--ink-3);cursor:grab;border:0;background:none;padding:0;border-radius:2px}
.grip:hover{color:var(--ink)}
.twist{width:18px;height:24px;flex:none;border:0;background:none;cursor:pointer;color:var(--ink-3);display:grid;place-items:center;border-radius:2px;padding:0}
.twist:hover{color:var(--ink)}
.twist svg{transition:transform .12s ease}
.tnode.open > .trow .twist svg{transform:rotate(90deg)}
.tname{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 4px 4px 0;text-align:left;color:var(--ink);cursor:pointer;border-radius:2px}
.trow.sel .tname{color:var(--blue-darker);font-weight:600}
.tname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tct{margin-left:auto;color:var(--ink-3);font-size:11px;padding-left:6px}
.trow.sel .tct{color:var(--blue-dark)}
.kebab{width:22px;height:22px;flex:none;border:0;background:none;color:var(--ink-3);border-radius:2px;cursor:pointer;opacity:0;line-height:1}
.trow:hover .kebab,.kebab:focus-visible,.trow.menu-open .kebab{opacity:1}
.kebab:hover{background:#e2e4e7;color:var(--ink)}
.tkids{margin-left:13px;border-left:1px solid var(--rule);padding-left:3px}
/* The menu lives inside the scrolling tree, so it must open INWARD: anchored
   to the node's right edge, and upward for the last nodes in the pane. */
.tmenu{position:absolute;z-index:70;right:6px;left:auto;top:24px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:var(--r);box-shadow:0 6px 18px rgba(16,24,40,.16);padding:5px;min-width:150px;max-width:calc(100% - 12px)}
.tree-scroll > .tnode:nth-last-child(-n+2) > .trow ~ .tmenu{top:auto;bottom:24px}
.tmenu > button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:2px;cursor:pointer;color:var(--ink)}
.tmenu > button:hover{background:var(--blue-tint)}
.tmenu > button.danger{color:var(--bad)}
.tmenu .mv{padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.tmenu .mv .field{width:100%;min-width:0}
.trename{height:24px;font-size:13px;flex:1;min-width:0;border:1px solid var(--blue);box-shadow:0 0 0 1px var(--blue);border-radius:2px;padding:0 5px}

/* ---------------- grid pane ---------------- */
.grid-pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.chips{display:flex;gap:2px;background:#e9eaec;border-radius:4px;padding:2px}
.chips button{border:0;background:none;padding:0 10px;height:26px;border-radius:3px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.chips .save{color:var(--blue-dark)}
.search{position:relative;flex:0 1 210px;min-width:140px;display:flex}
.search .field{width:100%;padding-left:26px}
.search .mag{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:grid}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:var(--panel);height:28px;padding:0 10px;color:var(--ink-2);cursor:pointer;font-size:12px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue-tint);color:var(--blue-darker);font-weight:600;box-shadow:inset 0 -2px 0 var(--blue)}
/* Both groups clip their children, so the global outline-offset:1px ring is
   cut away. Draw the ring inside the button instead. */
.screennav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 5px);z-index:60;min-width:215px;background:var(--panel);border:1px solid var(--rule-strong);border-radius:var(--r);box-shadow:0 8px 24px rgba(16,24,40,.16);padding:8px}
.pop.left{right:auto;left:0}
.pop h3{font-size:12px;font-weight:600;color:var(--ink-2);padding:2px 6px 6px}
.pop .prow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border:0;background:none;border-radius:2px;text-align:left;cursor:pointer;color:var(--ink)}
.pop .prow:hover{background:var(--blue-tint)}
.pop .frow{display:flex;flex-direction:column;gap:4px;padding:5px 6px}
.pop hr{border:0;border-top:1px solid var(--rule-soft);margin:6px 2px}
.pop .note{padding:4px 6px 2px;color:var(--ink-3);font-size:11px}
.filternote{display:flex;align-items:center;gap:10px;padding:6px 11px;background:var(--blue-tint);border-bottom:1px solid var(--blue-line);color:var(--ink-2);font-size:12px}

/* selection bar, top of table */
.selbar{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--blue-tint);border-bottom:1px solid var(--blue-line);flex-wrap:wrap}
.selbar .c{font-weight:600}
.selbar .grow{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.selbar.idle{background:var(--sunk);border-bottom-color:var(--rule);color:var(--ink-3)}

/* ---------------- table ---------------- */
.tscroll{flex:1;min-height:0;overflow:auto}
table.grid{width:100%;border-collapse:separate;border-spacing:0;min-width:620px}
table.grid thead th{
  position:sticky;top:0;z-index:5;background:var(--sunk);border-bottom:1px solid var(--rule-strong);
  text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px;white-space:nowrap;
}
table.grid td{border-bottom:1px solid var(--rule-soft);padding:7px 8px;vertical-align:middle}
table.grid tbody tr:hover td{background:var(--sunk-2)}
table.grid tbody tr.sel td{background:var(--blue-tint)}
table.grid tbody tr.sel:hover td{background:#e6f1fa}
.c-check{width:32px;padding-left:10px !important}
.c-price{width:120px}
.c-stock{width:112px}
.c-status{width:98px}
.c-vis{width:114px}
.c-sku{width:96px}
.c-cats{width:132px}
/* the sticky thead rule above sets text-align:left, so the right-aligned
   columns have to name it again or the Price header sits off its numbers */
table.grid thead th.r,th.r,td.r{text-align:right}
.pcell{display:flex;align-items:center;gap:8px;min-width:0}
.thumb{width:26px;height:26px;flex:none;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;letter-spacing:.02em}
.pname{min-width:0;display:flex;flex-direction:column;gap:1px}
.pname .n{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--blue-dark);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname .n:hover{text-decoration:underline;color:var(--blue-darker)}
/* Under the 1300px fold this span carries the product code and the category as
   well, so it is allowed to wrap onto a second line. Nothing is clipped: the
   narrow media query gives every row the same height instead. */
/* width:0 + min-width:100% keeps this line from widening the Product column:
   it renders at the cell's width but asks the table for nothing. */
.pname .m{color:var(--ink-3);font-size:11px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  width:0;min-width:100%}
.pname .m > *{flex:none}
.pname .m .narrowonly{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
/* the product name under an option row: too long to fit ends in an ellipsis
   and keeps its tooltip, rather than being cut off mid-letter */
.pname .m .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.narrowonly{display:none}
.expander{width:20px;height:20px;flex:none;border:1px solid var(--rule);border-radius:2px;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);padding:0}
.expander:hover{border-color:#8c8f94;background:var(--sunk)}
.expander svg{transition:transform .12s ease}
.expander[aria-expanded="true"] svg{transform:rotate(90deg)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;border:1px solid transparent;white-space:nowrap}
.pill.good{background:var(--good-tint);color:var(--good-ink);border-color:var(--good-line)}
.pill.warn{background:var(--warn-tint);color:var(--warn-ink);border-color:var(--warn-line)}
.pill.bad{background:var(--bad-tint);color:var(--bad-ink);border-color:var(--bad-line)}
.pill.grey{background:var(--sunk);color:var(--ink-2);border-color:var(--rule)}
.pill.opt{background:var(--sunk);color:var(--ink-2);border-color:var(--rule)}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--sunk);border:1px solid var(--rule);color:var(--ink-2);font-size:11px;white-space:nowrap}
.money{font-variant-numeric:tabular-nums}
.sale{color:var(--good-ink);font-size:11px;display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.was{color:var(--ink-3);text-decoration:line-through}
.cellbtn{display:inline-block;min-width:60px;padding:2px 5px;border:1px solid transparent;border-radius:2px;background:none;cursor:text;text-align:right;color:inherit;font-variant-numeric:tabular-nums}
.cellbtn:hover{border-color:var(--rule);background:var(--panel)}
.cellin{width:80px;height:26px;text-align:right;border:1px solid var(--blue);box-shadow:0 0 0 1px var(--blue);border-radius:2px;padding:0 6px;font-variant-numeric:tabular-nums}
.mini{width:78px;height:26px;padding:0 6px;border:1px solid var(--rule-strong);border-radius:2px;background:var(--panel);font-variant-numeric:tabular-nums;text-align:right}
.mini:hover{border-color:#8c8f94}
.mini:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue);outline:none}
.mini.qty{width:66px}

/* visible-on-site switch */
.switch{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:2px;cursor:pointer}
.track{width:34px;height:18px;flex:none;border-radius:9px;background:#8c8f94;position:relative;transition:background .13s ease}
.knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .13s ease;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"] .track{background:var(--good)}
.switch[aria-checked="true"] .knob{transform:translateX(16px)}
.switch .sl{font-size:11px;color:var(--ink-3);width:50px;text-align:left}
.switch[aria-checked="true"] .sl{color:var(--good-ink)}

/* variation rows */
tr.vrow td{background:var(--sunk-2)}
tr.vrow:hover td{background:#f4f6f8}
tr.vrow td.first{box-shadow:inset 3px 0 0 var(--blue-line)}
.vattrs{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-left:28px}
tr.vfoot td{background:var(--sunk-2);color:var(--ink-2);font-size:12px;padding:7px 8px 10px 40px;box-shadow:inset 3px 0 0 var(--blue-line)}
tr.vfoot .dot{color:var(--ink-3);padding:0 4px}

/* table footer */
.tfoot{display:flex;align-items:center;gap:10px;padding:8px 11px;border-top:1px solid var(--rule);color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.tfoot .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.pbtn{width:26px;height:26px;border:1px solid var(--rule-strong);background:var(--panel);border-radius:2px;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0}
.pbtn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------------- notices ---------------- */
.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r)}
.notice.ok{border-left-color:var(--good)}
.notice.warn{border-left-color:var(--warn);background:var(--warn-tint);border-color:var(--warn-line);border-left-color:var(--warn)}
.notice.err{border-left-color:var(--bad);background:var(--bad-tint);border-color:var(--bad-line);border-left-color:var(--bad)}
.notice .body{min-width:0;flex:1}
.notice b{display:block;margin-bottom:2px}
.notice .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:2px}
.notice .x:hover{color:var(--ink);background:var(--sunk)}

/* ---------------- states ---------------- */
.statewrap{flex:1;display:grid;place-items:center;padding:44px 20px}
.state{max-width:420px;text-align:center}
.state .glyph{width:46px;height:46px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--blue-tint);color:var(--blue)}
.state .glyph.bad{background:var(--bad-tint);color:var(--bad)}
.state h3{font-size:16px;font-weight:600;margin-bottom:6px}
.state p{color:var(--ink-2);margin-bottom:14px}
.state .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skel{height:12px;border-radius:2px;background:linear-gradient(90deg,#eceef0 25%,#f6f7f7 37%,#eceef0 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;display:block}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--blue-line);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- details drawer (overlay, closed by default) ---------------- */
#scrim{position:fixed;inset:var(--bar) 0 0 0;background:rgba(29,35,39,.28);z-index:130;opacity:0;transition:opacity .16s ease}
#drawer{
  position:fixed;top:var(--bar);right:0;bottom:0;width:368px;max-width:92vw;z-index:140;
  background:var(--panel);border-left:1px solid var(--rule-strong);box-shadow:-8px 0 26px rgba(16,24,40,.18);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .18s ease;
}
#drawer.open{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.dhead h2{font-size:13px;font-weight:600;flex:1}
.dclose{width:26px;height:26px;border:1px solid var(--rule-strong);background:var(--panel);border-radius:2px;color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0}
.dclose:hover{border-color:#8c8f94;background:var(--sunk);color:var(--ink)}
.dbody{flex:1;overflow:auto;padding:14px 14px 60px}
.dtitle{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.dtitle h3{font-size:15px;font-weight:600;line-height:1.35}
.dsec{border-top:1px solid var(--rule-soft);margin-top:14px;padding-top:12px}
.dsec h4{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fwrap{position:relative;min-width:0}
/* a value the product does not own: reported, not edited */
.ro{font-weight:600;padding:5px 0;font-variant-numeric:tabular-nums}
.fwrap .field{width:100%}
.tick{color:var(--good-ink);font-size:11px;display:inline-flex;align-items:center;gap:3px;margin-left:6px}
.optline{display:grid;grid-template-columns:minmax(0,1fr) 82px 70px;gap:8px;align-items:center;font-size:12px}
.optline .on{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}

/* ---------------- bulk change screen ---------------- */
.flow{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;overflow:hidden}
.flow-main{overflow:auto;padding:0;min-width:0}
.flow-side{border-left:1px solid var(--rule);background:var(--sunk);overflow:auto;padding:16px 14px 26px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;align-items:center;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.step .n{width:21px;height:21px;border-radius:50%;border:1px solid var(--rule-strong);flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--panel)}
.step.now{color:var(--ink);font-weight:600;border-bottom-color:var(--blue)}
.step.now .n{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done .n{background:var(--good-tint);border-color:var(--good-line);color:var(--good-ink)}
.step .arr{color:var(--rule-strong)}
.flowbody{padding:18px 20px 0;max-width:840px}
.flowbody h2{font-size:17px;font-weight:600;margin-bottom:4px}
.flowbody .sub{color:var(--ink-2);margin-bottom:16px;max-width:70ch}
/* max-width matches the flowbody's CONTENT box (840 - 2*20), so the rule and
   the step note line up with the cards above them. */
.flowfoot{position:sticky;bottom:0;z-index:4;background:var(--panel);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 20px 0;padding:14px 0;border-top:1px solid var(--rule);max-width:800px;box-shadow:0 -6px 12px -6px rgba(16,24,40,.12)}
.flowfoot .note{margin-left:auto;color:var(--ink-3);font-size:12px}

.choices{display:grid;gap:8px}
.choice{border:1px solid var(--rule);border-radius:4px;background:var(--panel);overflow:hidden}
.choice:hover{border-color:var(--blue-line)}
.choice.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.choice > label{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.choice .ct{display:block;font-weight:600}
.choice .cd{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.choice .cbody{border-top:1px dashed var(--rule);background:var(--sunk);padding:12px 12px 13px 40px;display:flex;gap:12px 16px;flex-wrap:wrap;align-items:flex-end}
.choice .cbody .fg{display:flex;flex-direction:column;min-width:0}
.choice .cbody .full{flex-basis:100%}
.caveat{color:var(--ink-3);font-size:12px;margin-top:9px}

.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px;flex-basis:100%}
.setcard{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);cursor:pointer}
.setcard:hover{border-color:var(--blue-line)}
.setcard.on{border-color:var(--blue);background:var(--blue-tint);box-shadow:inset 0 0 0 1px var(--blue)}
.setcard span{font-size:12px}
.setvalue{flex-basis:100%;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-top:4px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:12px}
.card h3{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.big{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.kv:last-of-type{border-bottom:0}
/* the label never shrinks or wraps; only the value wraps, and it stays right-aligned */
.kv dt{color:var(--ink-2);flex:none;white-space:nowrap}
.kv dd{font-weight:600;font-variant-numeric:tabular-nums;flex:1;min-width:0;text-align:right}

table.preview{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;min-width:520px}
table.preview th{background:var(--sunk);text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--rule)}
table.preview td{padding:7px 10px;border-bottom:1px solid var(--rule-soft)}
table.preview tr:last-child td{border-bottom:0}
table.preview .from{color:var(--ink-2);font-variant-numeric:tabular-nums}
table.preview .to{font-weight:600;color:var(--good-ink);font-variant-numeric:tabular-nums}
table.preview .to.down{color:var(--bad-ink)}
table.preview tr.vline td:first-child{padding-left:26px;color:var(--ink-2)}
/* a product the change cannot touch is listed too, so the table matches the
   amber notice instead of quietly leaving it out */
table.preview tr.skip td{background:var(--sunk);color:var(--ink-3)}
table.preview td.nochange{color:var(--ink-3)}
.varbox{margin-top:16px;border:1px solid var(--rule);border-radius:4px;background:var(--sunk);padding:12px 13px}
.varbox .why{margin:6px 0 0 24px;color:var(--ink-2);font-size:12px;max-width:66ch}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.progress{height:9px;border-radius:5px;background:#e5e7e9;overflow:hidden;max-width:520px;border:1px solid var(--rule)}
.progress > i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s linear}

/* ---------------- history ---------------- */
.hist{flex:1;min-height:0;overflow:auto;padding:16px 20px 26px}
.hist .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hist .bar .right{margin-left:auto;display:flex;gap:8px}
.batch{border:1px solid var(--rule);border-radius:4px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.batch.undone{background:var(--sunk-2)}
.btop{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;flex-wrap:wrap}
.btop .what{min-width:220px;flex:1}
.btop h3{font-size:14px;font-weight:600;margin-bottom:3px}
.btop .meta{color:var(--ink-2);font-size:12px}
.btop .meta .who{color:var(--ink);font-weight:600}
.btags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 14px 12px}
.bacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.conflict{border-top:1px solid var(--warn-line);background:var(--warn-tint);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.conflict .body{flex:1;min-width:0}
.conflict h4{font-size:13px;font-weight:600;margin-bottom:3px}
.conflict p{color:var(--warn-ink);font-size:12px;max-width:74ch;margin-bottom:10px}
.audit{border-top:1px solid var(--rule);background:var(--sunk-2)}
.audit .cap{padding:8px 14px;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--rule-soft)}
.audit .scroll{overflow-x:auto}
.audit table{width:100%;border-collapse:collapse;min-width:560px}
.audit th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-2);padding:6px 14px;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
.audit td{padding:6px 14px;border-bottom:1px solid var(--rule-soft);font-size:12px;font-variant-numeric:tabular-nums}
.audit tr:last-child td{border-bottom:0}
.audit .more{padding:9px 14px;color:var(--ink-3);font-size:12px;border-top:1px solid var(--rule-soft)}
.retain{color:var(--ink-3);font-size:12px;margin-top:14px}

/* ---------------- modal ---------------- */
#modalscrim{position:fixed;inset:0;background:rgba(29,35,39,.4);z-index:200;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border-radius:4px;box-shadow:0 20px 50px rgba(16,24,40,.32);width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal header{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.modal header h2{font-size:15px;font-weight:600;flex:1}
.modal .mbody{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);background:var(--sunk);flex-wrap:wrap}
.modal footer .grow{margin-left:auto;display:flex;gap:8px}
fieldset{border:0;padding:0;margin:0}
legend{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}

/* ---------------- prototype switcher ---------------- */
#proto{
  position:fixed;right:12px;bottom:10px;z-index:300;background:var(--menu);color:var(--menu-text);
  border-radius:6px;padding:5px 8px;box-shadow:0 10px 28px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:8px;font-size:12px;max-width:calc(100vw - 24px);flex-wrap:wrap;
}
#proto .div{width:1px;align-self:stretch;background:var(--menu-3)}
#proto .lab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#a7aaad}
#proto .row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#proto button{line-height:18px}
#proto button{border:1px solid var(--menu-3);background:var(--menu-2);color:#e5e7e9;border-radius:3px;padding:3px 8px;cursor:pointer;font-size:12px}
#proto button:hover{background:var(--menu-3);color:#fff}
#proto button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

/* ---------------- responsive ---------------- */
@media (max-width:1300px){
  /* drop the two low-value columns before the flagship switch could fall into a scroll region */
  .c-sku,.c-cats{display:none}
  .narrowonly{display:inline}
  /* The code and the category move under the product name here, so the meta
     line runs to two lines on any row that also carries an options pill or a
     Featured chip. Every row is given the height of the tallest, so the grid
     still scans evenly and nothing is cut off. */
  table.grid tbody tr{height:80px}
  /* a little of the spacing goes back into the Product column, so the folded
     code and category still settle on two lines rather than three */
  table.grid td .pcell{gap:6px}
  .pname .m{gap:4px}
}
@media (max-width:1180px){
  :root{--tree-w:168px}
  .flow{grid-template-columns:minmax(0,1fr) 262px}
  /* the three columns with room to spare give the Product column its width
     back before the admin menu folds, so the grid still fits at 1024 */
  .c-status{width:86px}
  .c-stock{width:100px}
  .c-vis{width:104px}
  .switch .sl{width:46px}
}
@media (max-width:1024px){
  /* the page itself tightens up here, as it always did; only the admin menu
     waits for 960 */
  /* the admin menu is still at full width here, so the tree gives up a little
     more: it keeps the Product column wide enough for the folded code and
     category to sit on one line under the name, two lines in all */
  :root{--tree-w:152px}
  #wpbody{padding:12px 14px 48px}
  .pagehead h1{font-size:20px}
  .pagehead .lede{display:none}
  .flowbody{padding-inline:16px;margin-inline:16px}
  .flowfoot{margin-inline:32px;padding-inline:0;margin-top:18px}
  .steps{padding-inline:16px}
}
/* wp-admin folds its own menu to icons at 960px, so this screen folds with it
   rather than a step early. The width that used to buy is taken back above,
   from the category tree and from the columns with room to spare. */
@media (max-width:960px){
  :root{--menu-w:36px}
  #adminmenu .mi .t,#adminmenu .sub{display:none}
  #adminmenu .mi{justify-content:center;padding:9px 0}
}
@media (max-width:880px){
  .slab{grid-template-columns:minmax(0,1fr)}
  .tree-pane{display:none}
  #proto{right:8px;bottom:8px}
}
@media (max-width:860px){
  .flow{grid-template-columns:minmax(0,1fr)}
  .flow-side{border-left:0;border-top:1px solid var(--rule)}
}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   1. Sample catalogue. A fictional promotional-merchandise shop.
   ===================================================================== */
var CAT_ROWS = [
  ["clothing","Clothing",null],
    ["tees","T-Shirts","clothing"],
      ["tees-short","Short sleeve","tees"],
      ["tees-long","Long sleeve","tees"],
    ["golf","Golf Shirts","clothing"],
    ["caps","Caps and Hats","clothing"],
      ["caps-cap","Caps","caps"],
      ["caps-beanie","Beanies","caps"],
  ["drink","Drinkware",null],
    ["mugs","Mugs","drink"],
      ["mugs-ceramic","Ceramic","mugs"],
      ["mugs-travel","Travel","mugs"],
    ["bottles","Bottles","drink"],
  ["writing","Writing",null],
    ["pens","Pens","writing"],
      ["pens-ball","Ballpoint","pens"],
      ["pens-metal","Metal","pens"],
    ["pencils","Pencils","writing"],
  ["paper","Paper",null],
    ["notebooks","Notebooks","paper"],
      ["nb-a5","A5","notebooks"],
      ["nb-a4","A4","notebooks"],
    ["notepads","Notepads","paper"],
  ["bags","Bags",null],
    ["totes","Tote Bags","bags"],
    ["backpacks","Backpacks","bags"],
  ["tech","Technology",null],
    ["usb","USB Drives","tech"],
    ["power","Power Banks","tech"],
  ["event","Event",null],
    ["lanyards","Lanyards","event"],
    ["badges","Badge Holders","event"],
  /* A permanent home for products whose category is deleted, so nothing is
     ever left pointing at an id that no longer exists. */
  ["uncategorised","Uncategorised",null]
];

var CATS = {};

function fmtValue(field, v) {

  if (field === "tags") return v && v.length ? v.join(", ") : "None";
  if (field === "stockStatus") return { instock:"In stock", outofstock:"Out of stock", onbackorder:"On backorder" }[v] || String(v);
  if (field === "qty") return nf(v);
  if (field === "featured" || field === "manageStock" || field === "soldIndividually") return v ? "Yes" : "No";

  if (v === null || v === undefined || v === "") return "—";
  /* Anything else chosen from a menu is read back through that menu, so the
     preview shows "Standard rate", never the value behind it. */
  var spec = SET_FIELDS && SET_FIELDS[field];
  if (spec && spec[1] === "select") {
    for (var i = 0; i < spec[2].length; i++) {

  var n = state.notice;
  host.innerHTML =
    '<div class="notice ' + n.kind + '"' + (n.kind === "err" ? ' role="alert" aria-live="assertive"' : ' role="status"') + ">" +
      '<div class="body">' + esc(n.text) + "</div>" +
      (n.undo ? '<button class="btn btn-sm" type="button" data-undoid="' + n.undo + '">Undo</button>' : "") +
      '<button class="x" type="button" data-dismiss="1" aria-label="Dismiss this notice">&times;</button>' +
    "</div>";
}

/* =====================================================================
   6. Category tree: filter, rename, move, delete, drag to re-parent
   ===================================================================== */
var openCats = { clothing:true, tees:true, drink:true };
var CHEV = '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var GRIP = '<svg width="8" height="12" viewBox="0 0 8 12" aria-hidden="true"><circle cx="2" cy="2" r="1"/><circle cx="6" cy="2" r="1"/><circle cx="2" cy="6" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="2" cy="10" r="1"/><circle cx="6" cy="10" r="1"/></svg>';

function isAncestor(a, b) {
  var c = CATS[b];
  while (c && c.parent) { if (c.parent === a) return true; c = CATS[c.parent]; }
  return false;
}
function siblingsOf(id) { return CATS[id].parent ? CATS[CATS[id].parent].kids : ROOTS; }
function detach(id) {
  var list = siblingsOf(id), i = list.indexOf(id);
  if (i !== -1) list.splice(i, 1);
}
function moveCat(dragId, targetId, mode) {
  if (dragId === targetId || isAncestor(dragId, targetId)) return false;
  detach(dragId);
  if (mode === "in") {
    CATS[dragId].parent = targetId;
    CATS[targetId].kids.push(dragId);
    openCats[targetId] = true;
  } else {
    var parent = CATS[targetId].parent;
    CATS[dragId].parent = parent;
    var list = parent ? CATS[parent].kids : ROOTS;
    var i = list.indexOf(targetId);
    list.splice(mode === "after" ? i + 1 : i, 0, dragId);
  }
  countCats();
  return true;
}

function renderTree() {
  var q = state.catSearch.trim().toLowerCase();
  function matches(id) {
    if (!q) return true;
    if (CATS[id].name.toLowerCase().indexOf(q) !== -1) return true;
    return CATS[id].kids.some(matches);
  }
  function node(id, depth) {
    if (!matches(id)) return "";
    var c = CATS[id];
    var hasKids = c.kids.length > 0;
    var open = q ? true : !!openCats[id];
    var sel = state.cat === id;
    var renaming = state.treeRename === id;
    var menu = state.treeMenu === id;
    var inner = renaming
      ? '<input class="trename" id="rn_' + id + '" value="' + esc(c.name) + '" aria-label="New name for ' + esc(c.name) + '">'
      : '<button class="tname" type="button" title="' + esc(c.name) + '" data-cat="' + id + '">' +
          '<span class="t">' + esc(c.name) + "</span>" +
          '<span class="tct num">' + nf(CAT_COUNT[id] * SCALE) + "</span></button>" +
        '<button class="kebab" type="button" data-kebab="' + id + '" aria-haspopup="true" aria-expanded="' + menu +
          '" aria-label="More actions for ' + esc(c.name) + '">&#8942;</button>';
    return (
      '<div class="tnode' + (open ? " open" : "") + '" data-node="' + id + '">' +
        '<div class="trow' + (sel ? " sel" : "") + (menu ? " menu-open" : "") + '" data-trow="' + id + '" draggable="true">' +
          '<span class="grip" role="img" aria-label="Drag to move ' + esc(c.name) + '">' + GRIP + "</span>" +
          (hasKids
            ? '<button class="twist" type="button" data-twist="' + id + '" aria-label="' + (open ? "Collapse " : "Expand ") + esc(c.name) + '">' + CHEV + "</button>"
            : '<span class="twist" aria-hidden="true"></span>') +
          inner +
        "</div>" +
        (menu ? treeMenuHTML(id) : "") +
        (hasKids ? '<div class="tkids"' + (open ? "" : " hidden") + ">" +
          c.kids.map(function (k) { return node(k, depth + 1); }).join("") + "</div>" : "") +
      "</div>"
    );
  }
  function treeMenuHTML(id) {
    if (state.treeMove === id) {
      var opts = Object.keys(CATS)
        .filter(function (k) { return k !== id && !isAncestor(id, k); })
        .map(function (k) { return '<option value="' + k + '">' + esc(catPath(k).join(" › ")) + "</option>"; }).join("");
      return '<div class="tmenu"><div class="mv">' +
        '<label class="lbl" for="mv_' + id + '">Move under</label>' +
        '<select class="field" id="mv_' + id + '"><option value="">Top level</option>' + opts + "</select>" +
        '<div style="display:flex;gap:6px"><button class="btn btn-primary btn-sm" type="button" data-movego="' + id + '">Move</button>' +
        '<button class="btn btn-quiet btn-sm" type="button" data-treeclose="1">Cancel</button></div></div></div>';
    }
    return '<div class="tmenu">' +
      '<button type="button" data-rename="' + id + '">Rename</button>' +
      '<button type="button" data-move="' + id + '">Move…</button>' +
      '<button type="button" class="danger" data-delcat="' + id + '">Delete</button></div>';
  }
  var all =
    '<div class="tnode"><div class="trow' + (state.cat === null ? " sel" : "") + '">' +
      '<span class="grip" aria-hidden="true" style="visibility:hidden">' + GRIP + "</span>" +
      '<span class="twist" aria-hidden="true"></span>' +
      '<button class="tname" type="button" data-cat="all"><span class="t">All products</span>' +
      '<span class="tct num">' + nf(shopTotal()) + "</span></button></div></div>";
  $("#tree").innerHTML = all + ROOTS.map(function (id) { return node(id, 1); }).join("");
  if (state.treeRename) {
    var el = $("#rn_" + state.treeRename);
    if (el) { el.focus(); el.select(); }
  }
}

/* drag and drop on the tree */
var dragId = null;
document.addEventListener("dragstart", function (e) {
  var row = e.target.closest ? e.target.closest("[data-trow]") : null;
  if (!row) return;
  dragId = row.getAttribute("data-trow");
  row.classList.add("drag");
  try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
});
document.addEventListener("dragend", function () {
  dragId = null;
  $$(".trow").forEach(function (r) { r.classList.remove("drag", "dz-before", "dz-after", "dz-in"); });
});
document.addEventListener("dragover", function (e) {
  var row = e.target.closest ? e.target.closest("[data-trow]") : null;
  if (!row || !dragId) return;
  e.preventDefault();
  var id = row.getAttribute("data-trow");
  $$(".trow").forEach(function (r) { if (r !== row) r.classList.remove("dz-before", "dz-after", "dz-in"); });
  row.classList.remove("dz-before", "dz-after", "dz-in");
  if (id === dragId || isAncestor(dragId, id)) return;
  var box = row.getBoundingClientRect();
  var pos = (e.clientY - box.top) / box.height;
  row.classList.add(pos < 0.28 ? "dz-before" : pos > 0.72 ? "dz-after" : "dz-in");
});
document.addEventListener("drop", function (e) {
  var row = e.target.closest ? e.target.closest("[data-trow]") : null;
  if (!row || !dragId) return;
  e.preventDefault();
  var id = row.getAttribute("data-trow");
  var mode = row.classList.contains("dz-before") ? "before" : row.classList.contains("dz-after") ? "after" : "in";
  var name = CATS[dragId] ? CATS[dragId].name : "";
  if (moveCat(dragId, id, mode)) {
    notify("ok", name + " moved " + (mode === "in" ? "under " : mode === "before" ? "above " : "below ") + CATS[id].name + ".");
  }
  dragId = null;
  render();
});

function toolbarHTML() {

        '<button class="btn btn-quiet btn-sm" type="button" data-pop="filters" aria-expanded="' + (state.pop === "filters") +

        '<div class="seg" role="group" aria-label="What the list shows">' +
          '<button type="button" data-mode="products" aria-pressed="' + (state.mode === "products") + '">Products</button>' +
          '<button type="button" data-mode="variations" aria-pressed="' + (state.mode === "variations") + '">Variations</button>' +
        "</div>" +
        (state.mode === "products"
          ? '<button class="btn btn-quiet btn-sm" type="button" id="expandAll">' + (anyClosed ? "Open all with variations" : "Close all options") + "</button>"
          : "") +

          (state.pop === "cols" ? colsPopHTML() : "") +

}
function filterPopHTML() {
  var f = state.filters;
  var sel = function (id, label, value, opts) {
    return '<div class="frow"><label class="lbl" for="' + id + '">' + label + "</label>" +
      '<select class="field" id="' + id + '">' + opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (value === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></div>";
  };
  return '<div class="pop left"><h3>Narrow the list</h3>' +
    sel("fStatus", "Published or draft", f.status, [["any","Published and draft"],["publish","Published"],["draft","Draft"]]) +
    sel("fStock", "Stock", f.stock, [["any","Any stock"],["instock","In stock"],["low","Low stock"],["outofstock","Out of stock"]]) +
    sel("fVis", "Visible on site", f.visible, [["any","Shown and hidden"],["yes","On site"],["no","Hidden from site"]]) +
    "<hr><button class=\"prow\" type=\"button\" data-clearfilters=\"1\">Clear all filters</button></div>";
}
function colsPopHTML() {
  var c = state.cols;
  var box = function (k, label) {
    return '<label class="prow"><input type="checkbox" data-col="' + k + '"' + (c[k] ? " checked" : "") + "> " + label + "</label>";

  /* Under the fold the Code and Category columns are hidden by the stylesheet

  var folded = function (k, label) {

  return '<div class="pop"><h3>Show these columns</h3>' +
    '<label class="prow"><input type="checkbox" checked disabled> Product</label>' +
    (narrow ? folded("sku", "Product code") + folded("cats", "Category") : box("sku", "Product code") + box("cats", "Category")) +
    box("stock", "Stock") + box("status", "Published or draft") +
    '<label class="prow"><input type="checkbox" checked disabled> Visible on site</label>' +

          : "Both are switched off.</p>")
      : "") +
    '<p class="note">Saved for you.</p></div>';
}
function filterNoteHTML() {
  var label = state.cat

function switchHTML(on, id, label) {

function headHTML() {

function colCount() {

function productRowHTML(p) {

  return (

function selbarHTML() {

      fg('<label class="lbl" for="fUnit">Percent or amount</label>',
        '<select class="field" id="fUnit"><option value="pct">percent</option><option value="abs">rand</option></select>') +
      fg('<label class="lbl" for="fWhich">Which price</label>',
        '<select class="field" id="fWhich"><option value="price">Regular price</option><option value="sale">Sale price</option></select>') +
      '<p class="caveat" style="flex-basis:100%">Prices already on sale keep their sale price unless you change that too.</p>';
  }
  if (id === "round") {
    return fg('<label class="lbl" for="fEnd">Round to the nearest</label>',
        '<select class="field" id="fEnd"><option value="0.99">price ending in .99</option><option value="0.95">price ending in .95</option>' +
        '<option value="0.50">price ending in .50</option><option value="0">whole rand</option></select>') +
      fg('<label class="lbl" for="fWhich">Which price</label>',
        '<select class="field" id="fWhich"><option value="price">Regular price</option><option value="sale">Sale price</option></select>') +
      '<p class="caveat" style="flex-basis:100%">Prices already on sale keep their sale price unless you change that too.</p>';
  }
  if (id === "copy_sale") {
    return fg('<label class="lbl" for="fDisc">Take off</label>',
        '<input class="field" id="fDisc" type="number" min="0" max="90" step="1" value="15" style="width:90px">') +
      '<p class="hint" style="padding-bottom:7px">percent of the regular price</p>' +
      '<p class="caveat" style="flex-basis:100%">Products already on sale get the new sale price instead of keeping the old one.</p>';
  }
  if (id === "replace") {
    return fg('<label class="lbl" for="fIn">Where</label>',
        '<select class="field" id="fIn"><option value="name">Product name</option><option value="sku">Product code</option></select>') +
      fg('<label class="lbl" for="fFind">Find</label>', '<input class="field" id="fFind" type="text" value="Cotton" style="width:150px">') +
      fg('<label class="lbl" for="fRepl">Replace with</label>', '<input class="field" id="fRepl" type="text" value="Organic Cotton" style="width:170px">');
  }
  if (id === "cats" || id === "tags") {
    var word = id === "cats" ? "category" : "tag";
    var ctrl = id === "cats"
      ? '<select class="field" id="fTerm">' + Object.keys(CATS).map(function (k) {
          return '<option value="' + k + '">' + esc(catPath(k).join(" › ")) + "</option>";
        }).join("") + "</select>"
      : '<input class="field" id="fTerm" type="text" value="Clearance" style="width:170px">';
    return fg('<label class="lbl" for="fOp">Do this</label>',
        '<select class="field" id="fOp">' +
        (id === "cats"
          ? '<option value="add">Put them in this category</option><option value="remove">Take them out of this category</option>'
          : '<option value="add">Add the ' + word + '</option><option value="remove">Remove the ' + word + "</option>") +
        "</select>") +
      fg('<label class="lbl" for="fTerm">' + (id === "cats" ? "Category" : "Tag") + "</label>", ctrl);
  }
  return "";
}

/* -------- working out what the change does -------- */
function fval(id, fallback) { var el = $("#" + id); return el ? el.value : fallback; }
var pendingOpts = {};
function captureOpts() {
  var a = state.flow.action;
  var o = { action:a };
  if (a === "set") { o.field = state.flow.setField; o.value = fval("setVal", ""); }
  if (a === "change_price") { o.dir = fval("fDir", "up"); o.amt = Number(fval("fAmt", 10)); o.unit = fval("fUnit", "pct"); o.which = fval("fWhich", "price"); }
  if (a === "round") { o.end = fval("fEnd", "0.99"); o.which = fval("fWhich", "price"); }
  if (a === "copy_sale") { o.disc = Number(fval("fDisc", 15)); }
  if (a === "replace") { o.where = fval("fIn", "name"); o.find = fval("fFind", "Cotton"); o.repl = fval("fRepl", "Organic Cotton"); }
  if (a === "cats" || a === "tags") { o.op = fval("fOp", "add"); o.term = fval("fTerm", a === "cats" ? "clothing" : "Clearance"); }
  pendingOpts = o;
  return o;
}
function roundTo(price, ending) {
  var e = Number(ending), base = Math.floor(price);
  var opts = [base - 1 + e, base + e, base + 1 + e].filter(function (v) { return v > 0; });
  return opts.reduce(function (best, v) { return Math.abs(v - price) < Math.abs(best - price) ? v : best; }, opts[0]);
}
function computeChanges(o) {
  var out = [], rows = targetProducts(), vrows = targetVars();
  var push = function (row, field, after, label) {
    var before = row[field];
    if (before === after) return;
    /* Belt and braces: an option that does not carry the field at all has no
       "before", and a preview row reading "Draft → Draft" helps nobody. */
    if (before === undefined && row.parent) return;
    out.push({ rid:row.id, field:field, label:label, before:before, after:after });
  };
  /* Parent first, then its options, so a sample off the top of the list is
     representative of the selection rather than one product's options. */
  /* A variable product has no price or stock of its own — the shop reads those
     off its options — so a price change must never be written to the parent.
     It reaches the options, or it reaches nothing. */
  var priceTargets = [];
  rows.forEach(function (p) {
    if (!p.vars.length) { priceTargets.push(p); return; }
    if (state.flow.applyToVars) { p.vars.forEach(function (v) { priceTargets.push(v); }); }
  });
  vrows.forEach(function (v) { priceTargets.push(v); });
  var allTargets = [];
  rows.forEach(function (p) {
    allTargets.push(p);
    if (state.flow.applyToVars) p.vars.forEach(function (v) { allTargets.push(v); });
  });
  vrows.forEach(function (v) { allTargets.push(v); });

  if (o.action === "change_price") {
    var sign = o.dir === "up" ? 1 : -1;
    priceTargets.forEach(function (r) {
      var cur = r[o.which];
      if (!cur || cur <= 0) return;
      var next = o.unit === "pct" ? cur * (1 + sign * o.amt / 100) : cur + sign * o.amt;
      push(r, o.which, Math.max(0, Math.round(next * 100) / 100), o.which === "price" ? "Regular price" : "Sale price");
    });
  } else if (o.action === "round") {
    priceTargets.forEach(function (r) {
      var cur = r[o.which];
      if (!cur || cur <= 0) return;
      push(r, o.which, Math.round(roundTo(cur, o.end) * 100) / 100, o.which === "price" ? "Regular price" : "Sale price");
    });
  } else if (o.action === "copy_sale") {
    priceTargets.forEach(function (r) {
      if (!r.price) return;
      push(r, "sale", Math.round(r.price * (1 - o.disc / 100) * 100) / 100, "Sale price");
    });
  } else if (o.action === "set") {
    var f = o.field, spec = SET_FIELDS[f];
    var targets = (f === "price" || f === "sale" || f === "qty" || f === "stockStatus") ? priceTargets : allTargets;
    targets.forEach(function (r) {
      if (r.parent && PRODUCT_ONLY_FIELDS.indexOf(f) !== -1) return;
      var v = o.value;
      if (spec[1] === "number") v = Number(v);
      if (f === "visible") { push(r, "visible", v === "1", "Visible on site"); return; }
      if (["featured","manageStock","soldIndividually","reviews"].indexOf(f) !== -1) { push(r, f, v === "1", spec[0]); return; }
      /* Real fields, so the Now column reads the category the product is in
         today and the grid, the drawer chips and the tree counts all move
         when the batch is applied. */
      if (f === "cats") { push(r, "cat", String(v), "Category"); return; }
      if (f === "tags") {
        if (r.tags.indexOf(String(v)) !== -1) return;
        push(r, "tags", r.tags.concat([String(v)]), "Tags");
        return;
      }
      if (f === "sku") { push(r, "sku", r.sku + String(v), "Product code"); return; }
      push(r, f, v, spec[0]);
    });
  } else if (o.action === "replace") {
    rows.forEach(function (p) {
      if (!o.find) return;
      var src = p[o.where] || "";
      if (src.indexOf(o.find) === -1) return;
      push(p, o.where, src.split(o.find).join(o.repl), o.where === "name" ? "Product name" : "Product code");
    });
  } else if (o.action === "cats") {
    var reach = CATS[o.term] ? descendants(o.term) : [];
    rows.forEach(function (p) {
      if (o.op === "add") { push(p, "cat", o.term, "Category"); return; }
      /* Taking a product out of a category has to put it somewhere: the
         category above it, or Uncategorised at the top. */
      if (reach.indexOf(p.cat) === -1) return;
      push(p, "cat", (CATS[o.term] && CATS[o.term].parent) || "uncategorised", "Category");
    });
  } else if (o.action === "tags") {
    rows.forEach(function (p) {
      var has = p.tags.indexOf(o.term) !== -1;
      if (o.op === "add") {
        if (has) return;
        push(p, "tags", p.tags.concat([o.term]), "Tags");
        return;
      }
      if (!has) return;
      push(p, "tags", p.tags.filter(function (t) { return t !== o.term; }), "Tags");
    });
  }
  return out;
}
/* A sample that stands for the whole selection: lead with one row per product,
   then fill with option rows, so the table is never eight slices of one product. */
function sampleChanges(changes, max) {
  if (changes.length <= max) return changes;
  var seen = {}, lead = [], rest = [];
  changes.forEach(function (c) {
    var r = rowById[c.rid];
    var key = "p" + (r && r.parent ? r.parent : c.rid);
    if (seen[key]) { rest.push(c); } else { seen[key] = true; lead.push(c); }
  });
  var take = Math.min(lead.length, Math.max(1, max - 3));
  return lead.slice(0, take).concat(rest).concat(lead.slice(take)).slice(0, max);
}

function describeChange(o) {
  if (o.action === "change_price") {
    return (o.dir === "up" ? "Increase " : "Decrease ") + (o.which === "price" ? "regular price" : "sale price") +
      " by " + o.amt + (o.unit === "pct" ? "%" : " rand");
  }
  if (o.action === "round") return "Round " + (o.which === "price" ? "regular prices" : "sale prices") + " to " +
    (Number(o.end) === 0 ? "a whole rand" : "an ending of ." + String(o.end).split(".")[1]);
  if (o.action === "copy_sale") return "Copy regular price to sale price, then take " + o.disc + "% off";
  /* No scope phrase here: every caller already states the scope ("… on 6
     products"), so carrying one would double it up. */
  if (o.action === "set") return "Set " + SET_FIELDS[o.field][0].toLowerCase();
  if (o.action === "replace") return "Replace “" + o.find + "” with “" + o.repl + "” in the " + (o.where === "name" ? "product name" : "product code");
  if (o.action === "cats") {
    var cname = CATS[o.term] ? CATS[o.term].name : "a deleted category";
    return (o.op === "add" ? "Put products in the category " : "Take products out of the category ") + cname;
  }
  if (o.action === "tags") return (o.op === "add" ? "Add the tag " : "Remove the tag ") + o.term;
  return "Make a change";
}

/* -------- side cards -------- */
function breakdownHTML() {
  var rows = targetProducts();
  var vrows = targetVars();
  /* Options ticked on the products screen are the selection: the card says so
     rather than describing them as products nobody ticked. */
  if (!rows.length && vrows.length) {
    var vparents = {};
    vrows.forEach(function (v) { vparents[v.parent] = true; });
    return '<div class="card"><h3>This change will affect</h3>' +
      '<p class="big num">' + nf(vrows.length) + "</p>" +
      '<p class="hint" style="margin-bottom:9px">options you ticked on the products screen</p>' +
      '<dl><div class="kv"><dt>Products they sit in</dt><dd class="num">' + nf(Object.keys(vparents).length) + "</dd></div>" +
      '<div class="kv"><dt>Out of stock</dt><dd class="num">' +
        nf(vrows.filter(function (v) { return v.qty === 0; }).length) + "</dd></div></dl>" +
      '<p style="margin-top:11px"><button class="btn btn-quiet btn-sm" type="button" data-goto="grid">Change the selection</button></p></div>' +
      '<div class="card"><h3>Safety</h3><p class="hint">Every batch is saved with the old values. One click in History puts them back.</p></div>';
  }
  var n = selectionCount();
  /* The prototype holds a sample of a bigger shop, so every derived figure is
     scaled by the same factor as the headline — or the card contradicts itself. */
  var f = rows.length ? n / rows.length : 1;
  var withOpts = Math.round(rows.filter(function (p) { return p.vars.length > 0; }).length * f);
  var hidden = Math.round(rows.filter(function (p) { return !p.visible; }).length * f);
  var drafts = Math.round(rows.filter(function (p) { return p.status === "draft"; }).length * f);
  return '<div class="card"><h3>This change will affect</h3>' +
    '<p class="big num">' + nf(n) + "</p>" +
    '<p class="hint" style="margin-bottom:9px">' + (state.allMatching ? "products matching the current filter" : "products you ticked on the products screen") + "</p>" +
    '<dl><div class="kv"><dt>With sizes or colours</dt><dd class="num">' + nf(withOpts) + "</dd></div>" +
    '<div class="kv"><dt>Hidden from the site</dt><dd class="num">' + nf(hidden) + "</dd></div>" +
    '<div class="kv"><dt>Drafts</dt><dd class="num">' + nf(drafts) + "</dd></div></dl>" +
    '<p style="margin-top:11px"><button class="btn btn-quiet btn-sm" type="button" data-goto="grid">Change the selection</button></p></div>' +
    '<div class="card"><h3>Safety</h3><p class="hint">Every batch is saved with the old values. One click in History puts them back.</p></div>';
}

/* Once the batch is away the selection is gone, so the pre-flight breakdown
   would read zero next to "6 products updated". Restate the batch instead. */
function doneSideHTML() {
  var b = state.flow.batch;
  if (!b) return breakdownHTML();
  var done = !!state.flow.done;
  var unit = b.unit === "option" ? "options" : "products";
  return '<div class="card"><h3>' + (done ? "What changed" : "What is being changed") + "</h3>" +
    '<p class="big num">' + nf(b.count) + "</p>" +
    '<p class="hint" style="margin-bottom:9px">' + unit + (done ? " updated" : " in this batch") + "</p>" +
    '<dl><div class="kv"><dt>Change</dt><dd>' + esc(b.what) + "</dd></div>" +
    '<div class="kv"><dt>Which ' + unit + "</dt><dd>" + esc(b.scope) + "</dd></div>" +
    (b.unit === "option"
      ? ""
      : '<div class="kv"><dt>Sizes and colours</dt><dd>' + (b.withVars ? "Included" : "Not included") + "</dd></div>") +
    "</dl>" +
    (done
      ? '<p style="margin-top:11px"><button class="btn btn-quiet btn-sm" type="button" data-goto="history">See it in History</button></p>'
      : "") + "</div>" +
    '<div class="card"><h3>Safety</h3><p class="hint">' +
      (done
        ? "The old values were saved with this batch. One click in History puts them back."
        : "The old values are being saved as this runs, so it can be put back from History.") +
    "</p></div>";
}

/* -------- the three steps -------- */
function flowHTML() {
  var b = state.flow;
  var stepNames = ["Choose the change", "Check it", "Done"];
  var steps = '<div class="steps">' + stepNames.map(function (nm, i) {
    var n = i + 1;
    var cls = b.step === n ? "step now" : b.step > n ? "step done" : "step";
    return (i ? '<span class="arr" aria-hidden="true">&rsaquo;</span>' : "") +
      '<span class="' + cls + '"><span class="n">' + (b.step > n ? "✓" : n) + "</span>" + nm + "</span>";
  }).join("") + "</div>";

  var main = "";
  if (b.step === 1) main = step1HTML();
  else if (b.step === 2) main = step2HTML();
  else main = step3HTML();

  return steps + '<div class="flow"><div class="flow-main">' + main + "</div>" +
    '<div class="flow-side">' + (b.step === 3 ? doneSideHTML() : breakdownHTML()) + "</div></div>";
}

function step1HTML() {
  var b = state.flow;
  /* Nothing is ever ticked on the user's behalf: an empty selection is said
     out loud rather than filled in with products nobody chose. */
  var empty = !flowTargetCount();
  var onOpts = flowOnOptions();
  return '<div class="flowbody"><h2>Choose the change</h2>' +
    '<p class="sub">Pick one change. You will see exactly what it does, on real ' +
      (onOpts ? "options" : "products") + ", before anything is saved.</p>" +
    (empty
      ? '<div class="notice warn" role="status" style="max-width:640px;margin-bottom:14px"><div class="body">' +
        "<b>Nothing is selected</b><p>Go back to Products and tick what you want to change.</p>" +
        '<div class="acts"><button class="btn btn-sm" type="button" data-goto="grid">Back to products</button></div>' +
        "</div></div>"
      : "") +
    '<div class="choices" role="radiogroup" aria-label="Choose the change"' + (empty ? ' aria-disabled="true"' : "") + ">" +
      ACTIONS.map(function (a) {
        return '<div class="choice' + (b.action === a.id ? " on" : "") + '"' +
            (empty ? ' style="opacity:.55"' : "") + ">" +
          '<label for="act_' + a.id + '"><input type="radio" name="bulkaction" id="act_' + a.id + '" value="' + a.id + '"' +
            (b.action === a.id ? " checked" : "") + (empty ? " disabled" : "") + ">" +
          '<span><span class="ct">' + a.t + '</span><span class="cd">' + a.d + "</span>" +
          '<span class="cd" style="margin-top:3px">' + a.consequence + "</span></span></label>" +
          (b.action === a.id && !empty ? '<div class="cbody">' + actionBodyHTML(a.id) + "</div>" : "") +
        "</div>";
      }).join("") +
    "</div></div>" +
    '<div class="flowfoot"><button class="btn btn-primary" type="button" data-step="2"' + (empty ? " disabled" : "") +
      ">Check the change</button>" +
    '<button class="btn btn-quiet" type="button" data-goto="grid">Back to products</button>' +
    '<span class="note">Step 1 of 3 &middot; You can undo this afterwards</span></div>';
}

function step2HTML() {
  var o = pendingOpts.action ? pendingOpts : captureOpts();
  var changes = computeChanges(o);
  var sample = sampleChanges(changes, 8);
  var onOpts = flowOnOptions();
  var n = flowTargetCount();
  var rows = targetProducts();
  /* Same scaling factor as the headline, so nothing on this screen disagrees. */
  var f = rows.length ? n / rows.length : 1;
  var withOpts = Math.round(rows.filter(function (p) { return p.vars.length > 0; }).length * f);
  /* Counted off the changes just computed, never off p.vars.length: the button
     and the callouts can then only ever claim what the table below lists. */
  var varCount = Math.round(changes.filter(function (c) {
    var r = rowById[c.rid]; return !!(r && r.parent);
  }).length * f);
  var shownTotal = Math.round(changes.length * f);
  var on = !!state.flow.applyToVars;
  var offers = varsOffered(o.action);
  var reaches = varsReach(o);

  /* Which of the chosen products this change actually lands on. A price change
     cannot land on a variable parent, so those are listed as no change rather
     than left out of a table that claims to show everything. */
  var touched = {};
  changes.forEach(function (c) {
    var r = rowById[c.rid];
    if (r) touched[r.parent || r.id] = true;
  });
  var priceAction = o.action === "change_price" || o.action === "round" || o.action === "copy_sale" ||
    (o.action === "set" && ["price","sale","qty","stockStatus"].indexOf(o.field) !== -1);
  var skipped = priceAction
    ? rows.filter(function (p) { return p.vars.length && !touched[p.id]; })
    : [];
  var nTouched = Math.round(Object.keys(touched).length * f);
  var skipWord = (o.action === "set" && (o.field === "qty" || o.field === "stockStatus")) ? "Stock"
    : (o.which === "sale" || o.action === "copy_sale") ? "Sale price" : "Regular price";
  var skipRows = skipped.slice(0, 4).map(function (p) {
    return '<tr class="skip"><td>' + esc(p.name) + "</td><td>" + skipWord + "</td>" +
      '<td colspan="2" class="nochange">No change — ' +
      (skipWord === "Stock" ? "stock is counted on each option" : "price is set on each option") + "</td></tr>";
  }).join("");

  var table = (sample.length || skipRows)
    ? '<div style="overflow-x:auto"><table class="preview"><thead><tr>' +
        "<th>Product</th><th>What changes</th><th>Now</th><th>After</th></tr></thead><tbody>" +
        sample.map(function (c) {
          var r = rowById[c.rid];
          var down = typeof c.before === "number" && typeof c.after === "number" && c.after < c.before;
          return '<tr' + (r && r.parent ? ' class="vline"' : "") + "><td>" + esc(rowName(c)) + "</td>" +
            "<td>" + esc(c.label) + '</td><td class="from">' + esc(fmtValue(c.field, c.before)) + "</td>" +
            '<td class="to' + (down ? " down" : "") + '">' + esc(fmtValue(c.field, c.after)) + "</td></tr>";
        }).join("") + skipRows +
      "</tbody></table></div>" +
      /* The caption counts CHANGES, because that is what the table lists. */
      (changes.length > sample.length
        ? '<p class="hint" style="margin-top:9px">The first ' + sample.length + " of " + nf(shownTotal) +
          " changes are shown. The same change applies to the rest." +
          (skipped.length ? " " + noChangePhrase(Math.round(skipped.length * f)) : "") + "</p>"
        : '<p class="hint" style="margin-top:9px">Every change is shown.' +
          (skipped.length ? " " + noChangePhrase(Math.round(skipped.length * f)) : "") + "</p>")
    : '<div class="notice warn"><div class="body"><b>Nothing would change</b>' +
      "<p>None of the chosen products would be different after this change. Go back and adjust it.</p></div></div>";

  /* Both of these are keyed to the live tick box, never to the default — and
     neither describes a preview that has nothing in it. */
  var worth = (changes.length && withOpts && offers && reaches)
    ? '<div class="notice warn" style="margin-top:14px"><div class="body"><b>Worth knowing</b>' +
      "<p>" + nf(withOpts) + " of these products " + (withOpts === 1 ? "has" : "have") +
      " sizes or colours, and those carry their own prices and stock. " +
      (on
        ? "They are included in this change, and they appear in the preview above."
        : "Nothing happens to them until you switch the option below on — the preview lists them as no change.") +
      "</p></div></div>"
    : "";

  /* The tick box only appears for changes that really can reach the options.
     For a product-level field it would be a promise the preview contradicts. */
  /* When the ticks are already on options there is nothing to reach into. */
  var varbox = onOpts
    ? '<div class="varbox"><p class="why" style="margin-left:0">You ticked options, so this change goes straight to them. The products they sit in are not touched.</p></div>'
    : (offers && reaches)
    ? '<div class="varbox"><label class="check"><input type="checkbox" id="applyVars"' + (on ? " checked" : "") + ">" +
      "<span><strong>Also change the sizes and colours inside each product</strong></span></label>" +
      '<p class="why">' + (on
        ? (varCount
          ? "Switched on: the " + nf(varCount) + " sizes and colours inside these products will change too."
          : withOpts
            ? "Switched on, and the sizes and colours are included — none of them need this change."
            : "Switched on, but none of the chosen products have sizes or colours.")
        : "Switched off because sizes and colours often have their own prices and stock. Switch it on to change them too.") +
      "</p></div>"
    : '<div class="varbox"><p class="why" style="margin-left:0">' + esc(productOnlyWhy(o)) + "</p></div>";

  /* The button counts what the preview lists, not what was ticked, so it can
     never offer to change products this change leaves alone. */
  var applyLabel = onOpts
    ? "Apply to " + plural(changes.length, "option", "options")
    : varCount
      ? "Apply to " + plural(nTouched, "product", "products") + " and " + plural(varCount, "option", "options")
      : "Apply to " + plural(nTouched, "product", "products");

  return '<div class="flowbody"><h2>Check it</h2>' +
    '<p class="sub">' + esc(describeChange(o)) + " on " +
      plural(n, onOpts ? "option" : "product", onOpts ? "options" : "products") + ". Nothing has been saved yet.</p>" +
    table +
    worth +
    varbox +
    "</div>" +
    '<div class="flowfoot"><button class="btn btn-primary" type="button" data-step="3"' + (changes.length ? "" : " disabled") + ">" + applyLabel + "</button>" +
    '<button class="btn btn-quiet" type="button" data-step="1">Back</button>' +
    '<span class="note">Step 2 of 3 &middot; You can undo this afterwards</span></div>';
}

function step3HTML() {
  var b = state.flow;
  var n = b.batch ? b.batch.count : flowTargetCount();
  var unitOne = b.batch && b.batch.unit === "option" ? "option" : "product";
  var unitMany = unitOne + "s";
  if (!b.done) {
    return '<div class="flowbody"><h2>Applying the change</h2>' +
      '<p class="sub">Working through ' + plural(n, unitOne, unitMany) + " in the background.</p>" +
      '<div class="progress"><i style="width:' + b.progress + '%"></i></div>' +
      '<p class="hint num" style="margin-top:8px" aria-live="polite">' + nf(Math.round(n * b.progress / 100)) + " of " + nf(n) + " done</p>" +
      '<p class="hint" style="margin-top:8px;max-width:64ch">You can leave this page. The update carries on in the background and appears in History when it finishes.</p>' +
      "</div>" +
      '<div class="flowfoot"><span class="note">Step 3 of 3 &middot; You can undo this afterwards</span></div>';
  }
  return '<div class="flowbody"><h2>Done</h2>' +
    '<div class="notice ok" style="max-width:640px"><div class="body"><b>' + esc(b.batch.what) + "</b>" +
    "<p>" + plural(b.batch.count, b.batch.unit === "option" ? "option" : "product",
      b.batch.unit === "option" ? "options" : "products") + " updated" +
    (b.batch.withVars ? ", sizes and colours included." : ".") +
    " The old values are saved, so you can put this back at any time.</p>" +
    '<div class="acts"><button class="btn btn-sm" type="button" data-undoid="' + b.batch.id + '">Undo this change</button>' +
    '<button class="btn btn-quiet btn-sm" type="button" data-goto="history">See it in History</button></div></div></div></div>' +
    '<div class="flowfoot"><button class="btn btn-primary" type="button" data-goto="grid">Back to products</button>' +
    '<button class="btn btn-quiet" type="button" data-step="1">Make another change</button>' +
    '<span class="note">Step 3 of 3 &middot; You can undo this afterwards</span></div>';
}

function runApply() {
  var o = pendingOpts.action ? pendingOpts : captureOpts();
  var changes = computeChanges(o);
  var onOpts = flowOnOptions();
  var rows = targetProducts();
  var f = rows.length ? selectionCount() / rows.length : 1;
  /* The batch is journalled with the count the preview showed: the products
     this change really landed on, not everything that happened to be ticked. */
  var touched = {};
  changes.forEach(function (c) { var r = rowById[c.rid]; if (r) touched[r.parent || r.id] = true; });
  changes.forEach(applyChange);
  countCats();
  var n = onOpts ? changes.length : Math.round(Object.keys(touched).length * f);
  var batch = record({
    when:"Today", time:stamp(),
    ago:"just now", who:"Mia Fourie", what:describeChange(o),
    /* Only an explicit "select all that match" may be journalled as a
       catalogue-wide edit; ticked rows are a hand-picked selection. */
    scope:state.allMatching
      ? (state.cat ? "Category: " + catPath(state.cat).join(" › ") : (filtersActive() ? "Filtered list" : "All products"))
      : (onOpts ? "Selected options" : "Selected products"),
    /* A batch can never claim a scope computeChanges() did not touch. */
    count:n, unit:onOpts ? "option" : "product",
    withVars:!onOpts && state.flow.applyToVars && varsReach(o) &&
      changes.some(function (c) { var r = rowById[c.rid]; return !!(r && r.parent); }),
    kind:(o.action === "set" ? "values" : o.action === "change_price" || o.action === "round" || o.action === "copy_sale" ? "price" : "values"),
    changes:changes
  });
  state.flow.batch = batch;
  state.flow.progress = 0;
  state.flow.done = false;
  render();
  var tick = function () {
    state.flow.progress = Math.min(100, state.flow.progress + 20);
    if (state.flow.progress >= 100) {
      state.flow.done = true;
      state.selected = {}; state.selectedVars = {}; state.allMatching = false;
      render();
      return;
    }
    render();
    setTimeout(tick, 240);
  };
  setTimeout(tick, 260);
}

   10. History and undo
   ===================================================================== */
/* Each row is strictly later than the one above: minutes carry on the wrap. */
function auditTime(b, i) {
  var parts = String(b.time).split(":");
  var total = i * 13 + 7;
  var mins = Number(parts[1]) + Math.floor(total / 60);
  var hrs = Number(parts[0]) + Math.floor(mins / 60);
  return pad2(hrs % 24) + ":" + pad2(mins % 60) + ":" + pad2(total % 60);
}

function auditHTML(b) {
  var rows = b.changes.slice(0, 8);
  return '<div class="audit">' +
    '<div class="cap">Batch ' + esc(b.id) + " &mdash; every product, field, before and after value is kept.</div>" +
    '<div class="scroll"><table><thead><tr><th>Product</th><th>Field</th><th>Before</th><th>After</th><th>Time</th></tr></thead><tbody>' +
    rows.map(function (c, i) {
      return "<tr><td>" + esc(rowName(c)) + "</td><td>" + esc(c.label) + "</td>" +
        "<td>" + esc(fmtValue(c.field, c.before)) + "</td><td>" + esc(fmtValue(c.field, c.after)) + "</td>" +
        "<td>" + auditTime(b, i) + "</td></tr>";
    }).join("") +
    "</tbody></table></div>" +
    (b.count > rows.length
      ? '<p class="more">Showing ' + rows.length + " of " + nf(b.count) + " entries. " +
        '<button class="btn-link" type="button" data-exportlog="' + b.id + '">Download the full log (CSV)</button></p>'

  "</div>";
}

/* The three products someone edited after the batch — its own table, forced

function historyHTML() {

              (open ? "Hide the changes" : "See every change") + "</button>" +
            (settled
              ? '<button class="btn btn-sm" type="button" disabled>Undone</button>'

          (b.undone ? '<span class="pill good">Undone &middot; Put back by ' + esc(b.undoneBy || "someone") + "</span>" : "") +
          (b.partialUndone
            ? '<span class="pill good num">' + nf(b.undoneCount) + " of " + nf(b.count) + " put back by " +
              esc(b.undoneBy || "someone") + "</span>" +
              '<span class="pill warn">' + b.conflict + " left alone</span>"
            : "") +
        "</div>" +
        (conflict
          ? '<div class="conflict"><span aria-hidden="true">&#9888;</span><div class="body">' +
            "<h4>" + b.conflict + " of these products have changed since</h4>" +
            "<p>Someone edited " + b.conflict + " products after this change was made. Undoing would overwrite that later work. " +
            "The other " + nf(b.count - b.conflict) + " can go back safely.</p>" +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
              '<button class="btn btn-primary btn-sm" type="button" data-undosafe="' + b.id + '">Undo the other ' + nf(b.count - b.conflict) + "</button>" +
              '<button class="btn btn-quiet btn-sm" type="button" data-conflictaudit="' + b.id +
                '" aria-expanded="' + (state.conflictAuditOpen === b.id) + '">See the ' + b.conflict + " that changed</button>" +
              '<button class="btn btn-danger btn-sm" type="button" data-undoall="' + b.id + '">Undo all ' + nf(b.count) + " anyway</button>" +
              '<button class="btn-link" type="button" data-conflictcancel="1">Cancel</button>' +
            "</div></div></div>"
          : "") +
        (conflict && state.conflictAuditOpen === b.id ? conflictAuditHTML(b) : "") +
        (open ? auditHTML(b) : "") +
      "</article>";
    }).join("") +
    '<p class="retain">Older batches are removed automatically after 90 days. Change this in Settings.</p>' +
  "</div>";
}

var SETTINGS = { who:"managers", keepDays:90, batchSize:50 };

            (SETTINGS.who === "admins" ? " checked" : "") + "> <span>Administrators only</span></label></fieldset>" +

  }
