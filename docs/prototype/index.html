/* Closing a dialog has to put the keyboard back where it was, or a keyboard
   user lands at the top of the document and has to walk the whole page again.
   The opener is remembered on the way in; if the render that follows has
   replaced it, Settings is the one control that never moves. */
function openModal(m) { m.opener = document.activeElement; state.modal = m; renderModal(); }
function closeModal() {
  var opener = state.modal && state.modal.opener;
  state.modal = null;
  renderModal();
  if (opener && opener.focus && document.body.contains(opener)) { opener.focus(); return; }
  var fallback = document.getElementById("settingsBtn");
  if (fallback) fallback.focus();
}
function renderModal() {
  var host = $("#modalHost");
  if (!state.modal) { host.innerHTML = ""; return; }
  host.innerHTML = '<div id="modalscrim">' + modalHTML(state.modal) + "</div>";
  var f = host.querySelector("button, input, select");
  if (f) f.focus();
}

/* =====================================================================
   12. Top-level render
   ===================================================================== */
function render() {
  $$(".screennav button").forEach(function (b) {
    b.setAttribute("aria-current", b.getAttribute("data-screen") === state.screen ? "true" : "false");
  });
  var slab = $("#slab"), tree = $("#treePane");
  renderNotices();
  if (state.screen === "grid") {
    tree.hidden = false;
    slab.classList.remove("solo");
    renderTree();
    renderGrid();
  } else {
    tree.hidden = true;
    slab.classList.add("solo");
    $("#pane").innerHTML = state.screen === "flow" ? flowHTML() : historyHTML();
  }
  renderDrawer();
  renderModal();
  /* The switcher follows the app, not the other way round, so it stays true
     when navigation happens through the tabs or "Make a change to these". */
  setProtoScreen(
    state.screen === "flow" ? "3" :
    state.screen === "history" ? "4" :
    Object.keys(state.expanded).some(function (k) { return state.expanded[k]; }) ? "2" : "1"
  );
}

/* =====================================================================
   13. Events
   ===================================================================== */
function setProtoState(s) {
  state.forced = s;
  $$("#proto [data-state]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-state") === s)); });
}
function setProtoScreen(n) {
  $$("#proto [data-proto]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-proto") === n)); });
}
function goScreen(s) {
  state.screen = s;
  if (s === "flow") {
    /* Never tick rows on the user's behalf. A screen whose promise is "you will
       see exactly what it does" cannot start by substituting the target set:
       step 1 says so instead, and the demo selection is seeded once at boot. */
    if (state.flow.step === 3 && state.flow.done) { state.flow.step = 1; state.flow.done = false; state.flow.progress = 0; }
  }
  render();
}

document.addEventListener("click", function (e) {
  var t = e.target;
  var at = function (name) { var el = t.closest("[data-" + name + "]"); return el ? el.getAttribute("data-" + name) : null; };

  /* popovers and tree menus close on outside click */
  var popName = at("pop");
  if (popName) { state.pop = state.pop === popName ? null : popName; render(); return; }
  if (!t.closest(".pop") && state.pop) { state.pop = null; render(); }
  if (!t.closest(".tmenu") && !t.closest("[data-kebab]") && (state.treeMenu || state.treeMove)) {
    state.treeMenu = null; state.treeMove = null; render();
  }

  /* prototype switcher */
  var proto = at("proto");
  if (proto) {
    setProtoScreen(proto); setProtoState("normal");
    state.drawer = null;
    if (proto === "1") { state.screen = "grid"; state.mode = "products"; state.expanded = {}; }
    if (proto === "2") {
      state.screen = "grid"; state.mode = "products";
      PRODUCTS.forEach(function (p) { if (p.vars.length) state.expanded[p.id] = true; });
    }
    if (proto === "3") { state.flow.step = 1; state.flow.done = false; state.flow.progress = 0; goScreen("flow"); return; }
    if (proto === "4") { state.screen = "history"; }
    render(); return;
  }
  var st = at("state");
  if (st) { setProtoState(st); state.screen = "grid"; setProtoScreen("1"); render(); return; }

  /* section nav */
  var navBtn = t.closest(".screennav button");
  var goto = navBtn ? navBtn.getAttribute("data-screen") : at("goto");
  if (goto) { goScreen(goto); return; }

  /* notices */
  if (at("dismiss")) { state.notice = null; render(); return; }
  var undoId = at("undoid");
  if (undoId) {
    /* Every way into an undo asks the same question: the toast, the Done screen
       and the History row cannot differ on whether putting work back is
       confirmed. */
    var ub = HISTORY.filter(function (b) { return b.id === undoId; })[0];
    if (ub) {
      openModal({ kind:"confirm", title:"Undo this change?", ok:"Undo the change", body:undoWording(ub),
        onOk:function () { doUndo(ub, false); } });
    }
    return;
  }

  /* settings and export */
  if (t.id === "settingsBtn") { openModal({ kind:"settings" }); return; }
  if (at("modalclose")) { closeModal(); return; }
  if (at("savesettings")) {
    var who = document.querySelector('input[name="whoCan"]:checked');
    SETTINGS.who = who ? who.value : SETTINGS.who;
    SETTINGS.keepDays = Number($("#keepDays").value) || SETTINGS.keepDays;
    SETTINGS.batchSize = Number($("#batchSize").value) || SETTINGS.batchSize;
    closeModal();
    notify("ok", "Settings saved. History is kept for " + SETTINGS.keepDays + " days and " +
      (SETTINGS.who === "admins" ? "only administrators" : "shop managers and administrators") + " can use this screen.");
    render(); return;
  }
  if (at("modalok")) {
    var m = state.modal;
    closeModal();
    if (m && typeof m.onOk === "function") m.onOk();
    return;
  }
  if (t.id === "exportBtn") {
    notify("ok", "Exporting " + nf(selectionCount() || matchingTotal()) + " products to CSV. The file downloads when it is ready.");
    render(); return;
  }
  var xl = at("exportlog");
  if (xl) { notify("ok", "Exporting the change log to CSV. The file downloads when it is ready."); render(); return; }
  if (at("copyerr")) { notify("ok", "Error details copied. Paste them into a message to your host or to support."); render(); return; }
  if (at("retry4")) {
    setProtoState("normal");
    notify("ok", "Trying 4 products again. They will appear in History when they finish.");
    render(); return;
  }

  /* category tree */
  var twist = at("twist");
  if (twist) { openCats[twist] = !openCats[twist]; render(); return; }
  var cat = at("cat");
  if (cat) {
    state.cat = cat === "all" ? null : cat;
    if (cat !== "all") { var c = CATS[cat].parent; while (c) { openCats[c] = true; c = CATS[c].parent; } }
    state.selected = {}; state.selectedVars = {}; state.allMatching = false;
    render(); return;
  }
  if (t.id === "catShowAll") { state.cat = null; state.catSearch = ""; render(); return; }
  var keb = at("kebab");
  if (keb) { state.treeMenu = state.treeMenu === keb ? null : keb; state.treeMove = null; render(); return; }
  if (at("treeclose")) { state.treeMenu = null; state.treeMove = null; render(); return; }
  var rn = at("rename");
  if (rn) { state.treeRename = rn; state.treeMenu = null; render(); return; }
  var mv = at("move");
  if (mv) { state.treeMove = mv; render(); return; }
  var mvgo = at("movego");
  if (mvgo) {
    var dest = $("#mv_" + mvgo).value;
    var nm = CATS[mvgo].name;
    detach(mvgo);
    if (dest) { CATS[mvgo].parent = dest; CATS[dest].kids.push(mvgo); openCats[dest] = true; }
    else { CATS[mvgo].parent = null; ROOTS.push(mvgo); }
    countCats();
    state.treeMove = null; state.treeMenu = null;
    notify("ok", nm + " moved to " + (dest ? catPath(dest).join(" › ") : "the top level") + ".");
    render(); return;
  }
  var del = at("delcat");
  if (del) {
    state.treeMenu = null;
    openModal({
      kind:"confirm", title:"Delete this category?", danger:true, ok:"Delete category",
      body:"“" + CATS[del].name + "” and any categories under it will be removed. Products in it move to " +
        ((CATS[del].parent && CATS[CATS[del].parent]) ? "“" + CATS[CATS[del].parent].name + "”" : "Uncategorised") +
        " and stay in your shop.",
      onOk:function () {
        var name = CATS[del].name;
        /* Move the products out before the category goes, or every one of them
           is left pointing at an id that no longer exists — which is what the
           Category column would then print. */
        var gone = descendants(del), up = CATS[del].parent;
        var home = (up && CATS[up]) ? up : "uncategorised";
        var moved = 0;
        PRODUCTS.forEach(function (p) {
          if (gone.indexOf(p.cat) === -1) return;
          p.cat = home; moved++;
        });
        gone.forEach(function (k) { delete CATS[k]; });
        detachSafe(del);
        if (state.cat && !CATS[state.cat]) state.cat = null;
        countCats();
        notify("ok", name + " deleted. " + (moved
          /* The tree counts are scaled to the shop, so the confirmation has to
             be too — otherwise it contradicts the number just read. */
          ? plural(moved * SCALE, "product", "products") + " moved to " + catPath(home).join(" › ") + "."
          : "No products were in it."));
        render();
      }
    });
    return;
  }
  if (t.id === "addCat") {
    var id = "new-" + Date.now();
    CATS[id] = { id:id, name:"New category", parent:null, kids:[] };
    ROOTS.push(id);
    CAT_COUNT[id] = 0;
    state.treeRename = id;
    notify("ok", "Category added at the top level. Type its name, then drag it where it belongs.");
    render(); return;
  }

  /* views, filters, columns */
  var view = at("view");
  if (view) {
    state.view = view;
    var saved = SAVED_VIEWS.filter(function (v) { return v.id === view; })[0];
    if (saved && saved.saved) {
      /* A view the user saved carries the filters it was saved with, so going
         back to it restores the list they saw, not a blank one. */
      state.filters = { status:saved.filters.status, stock:saved.filters.stock, visible:saved.filters.visible };
      state.cat = saved.cat;
      state.search = saved.search;
    } else {
      state.filters = { status:"any", stock:"any", visible:"any" };
      if (view === "hidden") state.filters.visible = "no";
      if (view === "lowstock") state.filters.stock = "low";
    }
    state.selected = {}; state.allMatching = false;
    render(); return;
  }
  if (at("saveview")) {
    /* Saving really adds the view: it joins the row above the list, it is
       selected straight away, and clicking it later brings these filters back. */
    var nSaved = SAVED_VIEWS.filter(function (v) { return v.saved; }).length + 1;
    var nv = {
      id:"saved" + nSaved, label:"My view " + nSaved, saved:true,
      filters:{ status:state.filters.status, stock:state.filters.stock, visible:state.filters.visible },
      cat:state.cat, search:state.search
    };
    SAVED_VIEWS.push(nv);
    state.view = nv.id;
    notify("ok", "Saved as “" + nv.label + "”. It is in the row of views above the list, and it keeps the filters you have on now.");
    render(); return;
  }
  if (at("clearfilters")) {
    state.cat = null; state.search = ""; state.view = "all";
    state.filters = { status:"any", stock:"any", visible:"any" };
    setProtoState("normal");
    render(); return;
  }
  var mode = t.closest("[data-mode]");
  if (mode) {
    state.mode = mode.getAttribute("data-mode");
    state.selected = {}; state.selectedVars = {}; state.allMatching = false;
    render(); return;
  }
  if (t.id === "expandAll") {
    var anyClosed = PRODUCTS.some(function (p) { return p.vars.length && !state.expanded[p.id]; });
    PRODUCTS.forEach(function (p) { if (p.vars.length) { if (anyClosed) state.expanded[p.id] = true; else delete state.expanded[p.id]; } });
    render(); return;
  }

  /* selection */
  var check = at("check");
  if (check) {
    var cid = Number(check);
    state.selected[cid] = !state.selected[cid];
    /* Any tick drops out of select-all-matching: once the owner makes an
       exception, "every product that matches" is no longer what they asked
       for, and the flow must only carry the rows they can see ticked. */
    if (state.allMatching) state.allMatching = false;
    render();
    /* render() replaces the pane, so focus has to be put back on the same
       control in the fresh DOM: ticking 40 rows must not mean tabbing from the
       top of the document 40 times. */
    var cbBack = document.getElementById("cb" + cid);
    if (cbBack) cbBack.focus();
    return;
  }
  var vcheck = at("vcheck");
  if (vcheck) {
    var vid2 = Number(vcheck);
    state.selectedVars[vid2] = !state.selectedVars[vid2];
    if (state.allMatching) state.allMatching = false;
    render();
    var vcbBack = document.getElementById("vcb" + vid2);
    if (vcbBack) vcbBack.focus();
    return;
  }
  if (at("checkall")) {
    /* In Variations mode the header box owns the option rows on screen,
       not the product rows that are not being shown. */
    if (state.mode === "variations") {
      var vrows = flatVars();
      var allVOn = vrows.length > 0 && vrows.every(function (pair) { return !!state.selectedVars[pair[1].id]; });
      state.selectedVars = {};
      if (!allVOn) vrows.forEach(function (pair) { state.selectedVars[pair[1].id] = true; });
      state.selected = {}; state.allMatching = false;
      render();
      var allBack1 = document.getElementById("cbAll");
      if (allBack1) allBack1.focus();
      return;
    }
    var rows = filtered();
    var allOn = rows.every(function (p) { return !!state.selected[p.id]; });
    state.selected = {};
    if (!allOn) rows.forEach(function (p) { state.selected[p.id] = true; });
    state.allMatching = false;
    render();
    var allBack = document.getElementById("cbAll");
    if (allBack) allBack.focus();
    return;
  }
  var am = at("allmatching");
  if (am) {
    state.allMatching = am === "on";
    if (am === "on") filtered().forEach(function (p) { state.selected[p.id] = true; });
    render(); return;
  }
  if (at("clearsel")) { state.selected = {}; state.selectedVars = {}; state.allMatching = false; render(); return; }
  var sv = at("selvars");
  if (sv) { byId[Number(sv)].vars.forEach(function (v) { state.selectedVars[v.id] = true; }); render(); return; }

  /* rows */
  var ex = at("expand");
  if (ex) { var eid = Number(ex); state.expanded[eid] = !state.expanded[eid]; render(); return; }
  var op = at("open");
  if (op) { openDrawer(Number(op)); return; }
  if (t.id === "drawerClose" || t.id === "scrim") { closeDrawer(); return; }
  if (at("changecats")) {
    var catMsg = "Category picker opens here in the built plugin.";
    /* Raised from inside the drawer? Then it has to be answered inside the
       drawer — #notices lives behind the scrim and outside the modal. */
    if (state.drawer) {
      state.drawerNote = catMsg;
      renderDrawer();
      var backCats = document.querySelector('[data-changecats]');
      if (backCats) backCats.focus();
      /* No timer: this is an explanation, not a transient "Saved" tick, and it
         clears with the drawer. */
    } else {
      notify("ok", catMsg);
      render();
    }
    return;
  }

  /* visible-on-site switches */
  var visId = at("vis");
  if (visId) {
    var row = rowById[Number(visId)];
    var before = row.visible;
    row.visible = !before;
    if (!row.parent) row.catvis = row.visible ? "shop-search" : "hidden";
    var isOpt = !!row.parent;
    var label = isOpt ? optLabel(row) : row.name;
    /* An option is not a product: the log and the exported change file must not
       report one as the other. */
    var b = record({
      when:"Today", time:stamp(),
      ago:"just now", who:"Mia Fourie",
      scope:isOpt ? "One option" : "One product", unit:isOpt ? "option" : "product", kind:"visibility",
      what:isOpt
        ? (row.visible ? "Enabled an option" : "Stopped selling an option")
        : (row.visible ? "Showed a product on the site" : "Hid a product from the site"),
      count:1,
      changes:[{ rid:row.id, field:"visible", label:isOpt ? "Enabled" : "Visible on site", before:before, after:row.visible }]
    });
    notify("ok", label + " is now " +
      (isOpt
        ? (row.visible ? "enabled." : "not sold.")
        : (row.visible ? "on the site." : "hidden from the site.")), b.id);
    render();
    var visBack = document.querySelector('[data-vis="' + visId + '"]');
    if (visBack) visBack.focus();
    return;
  }

  /* quick actions */
  var quick = at("quick");
  if (quick) {
    var want = quick === "show";
    /* Hiding the whole shop in one click is as destructive as an undo, so it
       asks the same question first. */
    if (state.allMatching && selectionCount() > filtered().length) {
      openModal({
        kind:"confirm", danger:!want,
        title:want ? "Show every matching product?" : "Hide every matching product?",
        ok:want ? "Show them all" : "Hide them all",
        body:"This " + (want ? "shows " : "hides ") + nf(selectionCount()) + " products " +
          (want ? "in your shop" : "from your shop") + ". Continue?",
        onOk:function () { runQuickVisibility(want); }
      });
      return;
    }
    runQuickVisibility(want);
    return;
  }
  /* inline price editing on a product row */
  var edit = at("edit");
  if (edit && t.classList.contains("cellbtn")) { startInlineEdit(t, edit); return; }

  /* bulk flow steps */
  var step = at("step");
  if (step) {
    var s = Number(step);
    if (s === 2) {
      captureOpts();
      state.flow.applyToVars = flowVarsDefault();
    }
    if (s === 1) { state.flow.done = false; state.flow.progress = 0; }
    state.flow.step = s;
    if (s === 3) { runApply(); return; }
    render(); return;
  }

  /* history */
  var audit = at("audit");
  if (audit) { state.auditOpen[audit] = !state.auditOpen[audit]; render(); return; }
  /* Forced open, never toggled: this button must not close what was asked for. */
  var caudit = at("conflictaudit");
  if (caudit) { state.conflictAuditOpen = caudit; render(); return; }
  var uc = at("undoclick");
  if (uc) {
    var ub2 = HISTORY.filter(function (b) { return b.id === uc; })[0];
    if (ub2.conflict) { state.conflictOpen = ub2.id; render(); return; }
    openModal({ kind:"confirm", title:"Undo this change?", ok:"Undo the change", body:undoWording(ub2),
      onOk:function () { doUndo(ub2, false); } });
    return;
  }
  var us = at("undosafe");
  if (us) {
    var sb = HISTORY.filter(function (b) { return b.id === us; })[0];
    openModal({ kind:"confirm", title:"Undo this change?", ok:"Undo the other " + nf(sb.count - sb.conflict),
      body:"This puts " + nf(sb.count - sb.conflict) + " products back to their old prices and leaves the " + sb.conflict + " that changed since alone. Continue?",
      onOk:function () { doUndo(sb, true); } });
    return;
  }
  var ua = at("undoall");
  if (ua) {
    var ab = HISTORY.filter(function (b) { return b.id === ua; })[0];
    openModal({ kind:"confirm", title:"Undo everything in this batch?", ok:"Undo all " + nf(ab.count), danger:true,
      body:undoWording(ab) + " The " + ab.conflict + " products edited since will lose that later work.",
      onOk:function () { doUndo(ab, false); } });
    return;
  }
  if (at("conflictcancel")) { state.conflictOpen = null; state.conflictAuditOpen = null; render(); return; }
});

/* The one-click Show / Hide, shared by the selection bar and its confirmation. */
function runQuickVisibility(want) {
  var targets = targetProducts();
  /* In Variations mode the ticks are on options, so act on those instead. */
  var vtargets = targets.length ? [] : selectedVarIds().map(function (id) { return rowById[id]; }).filter(Boolean);
  var onOpts = !targets.length && vtargets.length > 0;
  var qrows = onOpts ? vtargets : targets;
  /* Label the batch with the whole selection, not just the rendered rows. */
  var qn = onOpts ? vtargets.length : selectionCount();
  var changes = qrows.filter(function (r) { return r.visible !== want; })
    .map(function (r) { return { rid:r.id, field:"visible", label:onOpts ? "Enabled" : "Visible on site", before:r.visible, after:want }; });
  changes.forEach(applyChange);
  if (!onOpts) targets.forEach(function (p) { p.catvis = p.visible ? "shop-search" : "hidden"; });
  var qb = record({
    when:"Today", time:stamp(), ago:"just now", who:"Mia Fourie", kind:"visibility",
    what:onOpts
      ? (want ? "Enabled options" : "Stopped selling options")
      : (want ? "Showed products on the site" : "Hid products from the site"),
    scope:onOpts ? "Selected options" : (state.cat ? "Category: " + catPath(state.cat).join(" › ") : "Selected products"),
    count:qn, unit:onOpts ? "option" : "product", changes:changes
  });
  notify("ok", plural(qn, onOpts ? "option is" : "product is", onOpts ? "options are" : "products are") +
    " now " + (onOpts
      ? (want ? "enabled." : "not sold.")
      : (want ? "on the site." : "hidden from the site.")), qb.id);
  render();
}

function detachSafe(id) {
  var i = ROOTS.indexOf(id);
  if (i !== -1) { ROOTS.splice(i, 1); return; }
  Object.keys(CATS).forEach(function (k) {
    var j = CATS[k].kids.indexOf(id);
    if (j !== -1) CATS[k].kids.splice(j, 1);
  });
}

document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "catSearch") { state.catSearch = t.value; renderTree(); return; }
  if (t.id === "q") {
    state.search = t.value; state.selected = {}; state.allMatching = false;
    renderGrid();
    var q = $("#q");
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
});

/* Editing an option in the drawer earns the same "Saved" tick as every other
   field there, on the same 2.2s window. */
function optLabel(v) {
  return byId[v.parent].name + " " + v.attrs.map(function (a) { return a[1]; }).join(" / ");
}
function optSaved(vid, inputId) {
  if (!state.drawer) return;
  state.savedField = "opt:" + vid;
  renderDrawer();
  var back = inputId ? $("#" + inputId) : null;
  if (back) back.focus();
  clearTimeout(window.__tick);
  window.__tick = setTimeout(function () {
    state.savedField = null;
    if (state.drawer) renderDrawer();
  }, 2200);
}

document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "fStatus") { state.filters.status = t.value; state.pop = "filters"; render(); return; }
  if (t.id === "fStock") { state.filters.stock = t.value; state.pop = "filters"; render(); return; }
  if (t.id === "fVis") { state.filters.visible = t.value; state.pop = "filters"; render(); return; }
  if (t.getAttribute && t.getAttribute("data-col")) {
    state.cols[t.getAttribute("data-col")] = t.checked; state.pop = "cols"; render(); return;
  }
  if (t.name === "bulkaction") {
    state.flow.action = t.value;
    state.flow.applyToVars = flowVarsDefault();
    pendingOpts = {};
    render(); return;
  }
  if (t.name === "setfield") {
    if (t.value === "__other") { state.flow.otherOpen = true; state.flow.setField = SET_OTHER[0]; }
    else { state.flow.otherOpen = false; state.flow.setField = t.value; }
    state.flow.applyToVars = flowVarsDefault();
    render(); return;
  }
  if (t.id === "otherField") {
    state.flow.setField = t.value; state.flow.otherOpen = true;
    state.flow.applyToVars = flowVarsDefault();
    render(); return;
  }
  if (t.id === "applyVars") { state.flow.applyToVars = t.checked; render(); return; }
  if (t.id === "hWho") { state.histWho = t.value; render(); return; }
  if (t.id === "hWhen") { state.histWhen = t.value; render(); return; }

  /* inline variation editing */
  var vp = t.getAttribute && t.getAttribute("data-vprice");
  if (vp) {
    var v1 = rowById[Number(vp)];
    var b1 = v1.price;
    v1.price = Number(t.value) || 0;
    var bp = record({ when:"Today", time:stamp(),
      ago:"just now", who:"Mia Fourie", scope:"One option", unit:"option", kind:"price",
      what:"Changed the price of one option", count:1,
      changes:[{ rid:v1.id, field:"price", label:"Regular price", before:b1, after:v1.price }] });
    /* In the grid there is no drawer to show a "Saved" tick, so an option earns
       the same notice and Undo that editing a product's price does. */
    if (!state.drawer) {
      notify("ok", "Saved. " + optLabel(v1) + " is now " + money(v1.price) + ".", bp.id);
      render();
      var againP = $("#" + t.id);
      if (againP) againP.focus();
      return;
    }
    optSaved(v1.id, t.id);
    return;
  }
  var vq = t.getAttribute && t.getAttribute("data-vqty");
  if (vq) {
    var v2 = rowById[Number(vq)];
    var b2 = v2.qty;
    v2.qty = Number(t.value) || 0;
    v2.stockStatus = v2.qty === 0 ? "outofstock" : "instock";
    /* The product's figure is the sum of its options, so it follows them. */
    var par2 = byId[v2.parent];
    par2.qty = par2.vars.reduce(function (s3, vv) { return s3 + vv.qty; }, 0);
    par2.stockStatus = par2.qty === 0 ? "outofstock" : "instock";
    var bq = record({ when:"Today", time:stamp(),
      ago:"just now", who:"Mia Fourie", scope:"One option", unit:"option", kind:"stock",
      what:"Changed the stock of one option", count:1,
      changes:[{ rid:v2.id, field:"qty", label:"Stock quantity", before:b2, after:v2.qty }] });
    if (!state.drawer) {
      notify("ok", "Saved. " + optLabel(v2) + " now has " + nf(v2.qty) + " in stock.", bq.id);
      render();
      var againQ = $("#" + t.id);
      if (againQ) againQ.focus();
      return;
    }
    optSaved(v2.id, t.id);
    return;
  }

  /* drawer fields save on blur/change */
  var df = t.getAttribute && t.getAttribute("data-dfield");
  if (df && state.drawer) {
    var p = byId[state.drawer];
    var before = p[df];
    var after = t.value;
    if (df === "price" || df === "sale") after = t.value === "" ? 0 : Number(t.value);
    if (df === "qty") after = Number(t.value) || 0;
    p[df] = after;
    if (df === "catvis") p.visible = after !== "hidden";
    if (df === "qty") p.stockStatus = after === 0 ? "outofstock" : p.stockStatus;
    record({ when:"Today", time:stamp(),
      ago:"just now", who:"Mia Fourie", scope:"One product", kind:"values",
      what:"Changed " + (SET_FIELDS[df] ? SET_FIELDS[df][0].toLowerCase() : df) + " on one product", count:1,
      changes:[{ rid:p.id, field:df, label:SET_FIELDS[df] ? SET_FIELDS[df][0] : df, before:before, after:after }] });
    state.savedField = df;
    render();
    var again = $("#" + t.id);
    if (again) again.focus();
    clearTimeout(window.__tick);
    window.__tick = setTimeout(function () { state.savedField = null; if (state.drawer) renderDrawer(); }, 2200);
  }
});

/* Everything a modal layer can hand focus to, in document order. */
var FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),' +
  'textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function focusablesIn(box) {
  return Array.prototype.filter.call(box.querySelectorAll(FOCUSABLE), function (el) {
    return el.offsetWidth || el.offsetHeight || el.getClientRects().length;
  });
}

document.addEventListener("keydown", function (e) {
  /* The drawer and the settings modal are both modal layers: Tab wraps inside
     whichever is open instead of escaping into the page behind the scrim. */
  if (e.key === "Tab" && (state.modal || state.drawer)) {
    var box = state.modal ? document.querySelector("#modalscrim .modal") : $("#drawer");
    var f = box ? focusablesIn(box) : [];
    if (f.length) {
      var first = f[0], last = f[f.length - 1];
      var inside = box.contains(document.activeElement);
      if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
    }
  }
  if (e.key === "Escape") {
    if (state.modal) { closeModal(); return; }
    if (state.drawer) { closeDrawer(); return; }
    if (state.pop) { state.pop = null; render(); return; }
    if (state.treeMenu || state.treeMove) { state.treeMenu = null; state.treeMove = null; render(); return; }
    if (state.conflictOpen) { state.conflictOpen = null; state.conflictAuditOpen = null; render(); return; }
  }
  if (e.target.classList && e.target.classList.contains("trename")) {
    if (e.key === "Enter") {
      e.preventDefault();
      var id = state.treeRename;
      CATS[id].name = e.target.value.trim() || CATS[id].name;
      state.treeRename = null;
      notify("ok", "Category renamed to " + CATS[id].name + ".");
      render();
    }
    if (e.key === "Escape") { e.preventDefault(); state.treeRename = null; render(); }
  }
});
document.addEventListener("focusout", function (e) {
  if (e.target.classList && e.target.classList.contains("trename") && state.treeRename) {
    var id = state.treeRename;
    if (CATS[id]) CATS[id].name = e.target.value.trim() || CATS[id].name;
    state.treeRename = null;
    render();
  }
});

function startInlineEdit(btn, key) {
  var parts = key.split(":");
  var field = parts[0];
  var p = byId[Number(parts[1])];
  var input = document.createElement("input");
  input.className = "cellin";
  input.type = "number";
  input.step = "0.01";
  input.min = "0";
  input.value = p[field] ? Number(p[field]).toFixed(2) : "";
  input.setAttribute("aria-label", (field === "price" ? "Regular price" : "Sale price") + " for " + p.name);
  btn.replaceWith(input);
  input.focus();
  input.select();
  var closed = false;
  var commit = function (save) {
    if (closed) return;
    closed = true;
    if (save) {
      var before = p[field];
      var after = input.value.trim() === "" ? 0 : Number(input.value);
      if (after !== before) {
        p[field] = after;
        var b = record({ when:"Today", time:stamp(),
          ago:"just now", who:"Mia Fourie", scope:"One product", kind:"price",
          what:"Changed the regular price of one product", count:1,
          changes:[{ rid:p.id, field:field, label:field === "price" ? "Regular price" : "Sale price", before:before, after:after }] });
        notify("ok", "Saved. " + p.name + " is now " + money(after) + ".", b.id);
      }
    }
    render();
  };
  input.addEventListener("blur", function () { commit(true); });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
    if (ev.key === "Escape") { ev.preventDefault(); commit(false); }
  });
}

/* =====================================================================
   14. Boot
   ===================================================================== */
/* Mostly simple products that carry a price of their own, so the pre-filled
   example is a real change and not a near-no-op — with exactly one variable
   product kept in, so the amber note and one "No change" row still teach the
   variation rule. */
state.selected[1] = true; state.selected[2] = true; state.selected[3] = true;
state.selected[5] = true; state.selected[7] = true; state.selected[8] = true;
render();
</script>
